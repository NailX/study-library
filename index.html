<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌面学习库 · 统一导航</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e6e9ef; --dim:#8b93a7; --accent:#5b8def; --hl:#ffd166;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:50;background:rgba(15,17,21,.94);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 20px}
  .htop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.3px}
  .stat{color:var(--dim);font-size:12.5px}
  .searchwrap{flex:1;min-width:260px;position:relative}
  #q{width:100%;padding:10px 14px 10px 36px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);font-size:14px;outline:none;transition:.15s}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,141,239,.15)}
  .searchwrap::before{content:"🔍";position:absolute;left:12px;top:9px;font-size:13px;opacity:.6}
  #count{color:var(--dim);font-size:12.5px;white-space:nowrap}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .chip{padding:5px 12px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);cursor:pointer;font-size:12.5px;color:var(--dim);
    transition:.15s;user-select:none}
  .chip:hover{border-color:#3d4554;color:var(--txt)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
  .chip .n{opacity:.65;font-size:11px;margin-left:4px}
  main{padding:20px;max-width:1500px;margin:0 auto}
  .grp{margin-bottom:26px}
  .grph{display:flex;align-items:baseline;gap:10px;margin:0 0 11px;padding-bottom:8px;
    border-bottom:1px solid var(--line)}
  .grph .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .grph h2{font-size:14.5px;margin:0;font-weight:600}
  .grph .lib{color:var(--dim);font-size:12px}
  .grph .cnt{color:var(--dim);font-size:12px;margin-left:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 15px;margin-bottom:8px;transition:.15s;position:relative}
  .card:hover{border-color:var(--accent);background:var(--panel2);transform:translateX(2px)}
  .card .t{font-size:14px;font-weight:550;margin-bottom:4px;line-height:1.45}
  .card .t mark{background:rgba(255,209,102,.25);color:var(--hl);border-radius:2px;padding:0 1px}
  .card .ex{color:var(--dim);font-size:12.5px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .ex mark{background:rgba(255,209,102,.18);color:var(--hl);border-radius:2px}
  .card .meta{margin-top:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim)}
  .open{margin-left:auto;font-size:11.5px;color:var(--accent);text-decoration:none;
    border:1px solid rgba(91,141,239,.4);padding:3px 10px;border-radius:6px}
  .open:hover{background:var(--accent);color:#fff}
  .pdfsec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 18px}
  .pdfsec h2{font-size:14.5px;margin:0 0 11px}
  .pdflist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
  .pdfitem{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--txt);font-size:12.5px}
  .pdfitem:hover{border-color:var(--accent)}
  .pdfitem .sz{color:var(--dim);font-size:11px;margin-left:auto;white-space:nowrap}
  .empty{text-align:center;color:var(--dim);padding:60px 20px}
  #top{position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:17px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);display:none}
  .hint{color:var(--dim);font-size:11.5px;margin-top:8px}
  .hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-size:11px;font-family:inherit}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>📚 桌面学习库</h1>
    <div class="stat" id="stat"></div>
    <div class="searchwrap"><input id="q" placeholder="搜索标题与正文…（支持多关键词，空格分隔）" autocomplete="off"></div>
    <div id="count"></div>
  </div>
  <div class="filters" id="libf"></div>
  <div class="filters" id="catf"></div>
  <div class="hint">快捷键：<kbd>/</kbd> 聚焦搜索 · <kbd>Esc</kbd> 清空 · 点击标题旁「打开」定位文件</div>
</header>
<main>
  <div id="pdfwrap"></div>
  <div id="list"></div>
  <div id="empty" class="empty" style="display:none">没有匹配的文章</div>
</main>
<button id="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>

业的财务数据和估值？", "path": "马靖昊说会计_分类/投资估值/0063 麻烦马老师分析一下众生药业的财务数据和估值？.txt", "size": 8599, "excerpt": "有网友ShenZhenHappyTea在“微博问答”中提问：麻烦马老师分析一下众生药业的财务数据和估值？您好，现就您的问题答复如下：一、产业链地位低，商业模式存先天缺陷，利润质量较差1、产业链地位低，现金循环周期较长，资金周转能力较差。2019年度末，该公司应收账款余额12.17"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "投资估值", "title": "双塔食品，这个公司是这两年的大牛股，好像存在存贷双高的现象，有投资价值吗？", "path": "马靖昊说会计_分类/投资估值/0066 双塔食品，这个公司是这两年的大牛股，好像存在存贷双高的现象，有投资价值吗？.txt", "size": 9156, "excerpt": "一位名叫YANKEE009的网友在微博提问中咨询：马老师，请分析一下双塔食品，这个公司是这两年的大牛股，好像存在存贷双高的现象，有投资价值吗，请指教。 马靖昊：您好，下面就您的问题进行答复。 双塔食品的主营业务是生产销售粉丝，属于农副食品加工行业，翻看该公司的财报，扫一眼就可发现"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "投资估值", "title": "长期股权投资！！！", "path": "马靖昊说会计_分类/投资估值/0090 长期股权投资！！！.txt", "size": 6730, "excerpt": "（一） 长期股权投资采用“成本法”或者“权益法”进行核算，根据会计准则的要求，对被投资企业是否有控制权，决定了采用成本法核算还是采用权益法核算。 1.成本法，公司能够对被投资单位实施控制的长期股权投资，在财务报表中采用成本法核算。一般情况下，控股50%以上~100%认为有控制权。"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "投资估值", "title": "上市公司巨额分红真那么好吗？", "path": "马靖昊说会计_分类/投资估值/0118 上市公司巨额分红真那么好吗？.txt", "size": 9340, "excerpt": "上市公司分红天经地义，甚至证监会一直在鼓励有条件的上市公司要积极分红，并将它作为再融资的一个考核指标。如果企业盈利较为理想，现金流良好，长期不分红或分红少也难免被称不厚道。不过，这里要谈的问题并不是上市公司分不分红，而是上市公司“土豪式”巨额分红的问题。 问题引出：一家高额分红的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "投资估值", "title": "【非常启发】段永平：投资需要如何思考", "path": "马靖昊说会计_分类/投资估值/0126 【非常启发】段永平：投资需要如何思考.txt", "size": 20008, "excerpt": "1 问：什么是投资？段永平：拥有一家公司的部分或者全部，最简单的概念就是“拥有”。 2 问：什么是投资中最重要的事？段永平：a、买股票就是买公司，是不是上市没有关系，上市只是方便退出而已； b、公司未来现金流的折现就是公司的内在价值，买股票应该在股价低于内在价值时买，至于是低40"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "投资估值", "title": "庞氏骗局：庞氏分红与庞氏利息", "path": "马靖昊说会计_分类/投资估值/0221 庞氏骗局：庞氏分红与庞氏利息.txt", "size": 7136, "excerpt": "一 2012-7-8 13:24 （如果不遵守各种规章制度）股市可能就是一个合法的庞氏骗局，很多控股股东其实就是美国的那个麦道夫。比如，上市公司产生了10亿净利润，其中只有0.8亿现金利润，它把3亿利润用来分红，那么2.2亿分红就只能动用借款了，这其实就是庞氏分红，其后果必然减损"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "投资估值", "title": "选股！！！", "path": "马靖昊说会计_分类/投资估值/0226 选股！！！.txt", "size": 8794, "excerpt": "一 如果我来选股票，我会把过去连续 5~10 年平均 ROE 低于 15% 的企业全部排除掉，只关注那些  如果一家上市公司每年有不少利润而长期不分红，按道理，这些留存收益在企业中经过循环经营应该不断增值，并通过股价得到反映，股价应该上升才是。反之，股价一直徘徊不前甚至下跌，这时候就基本上可以判断该公司的利润数据是造假的，相应，其资产中含有大量的“水分”。 lyb195910："}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "早晨，匆匆吃了点原材料，拖着疲惫的正在折旧并减值中的固定资产，为了生活开始了拼搏……", "path": "马靖昊说会计_分类/财务指标解读/0053 早晨，匆匆吃了点原材料，拖着疲惫的正在折旧并减值中的固定资产，为了生活开始了拼搏…….txt", "size": 6107, "excerpt": "（一） 早晨，匆匆吃了点原材料，拖着疲惫的正在折旧并减值中的固定资产，为了生活开始了拼搏。主营业务收入一直不怎么增加，物价上涨却让主营业务成本无情地吞嗤着残存的毛利。前几年得到计生委的允许，弄出了两个子公司，可这都是长达二十多年的长期股权投资，搞得信用卡尽是短期借款。 期待着营业"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "烦请马老师看看中国神华？​", "path": "马靖昊说会计_分类/财务指标解读/0054 烦请马老师看看中国神华？​.txt", "size": 7087, "excerpt": "用户ljgr54wksi：烦请马老师看看中国神华？ 马靖昊：您好，现就您的问题答复如下： 在我的印象中，中国神华就是产煤卖煤的，而煤炭是一个产能过剩的行业，因此想当然地认为中国神华的财务报表不会很好看。不过，真出乎我的意料，中国神华财务报表的各项指标都超出预期的好。 一、产业链话"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "频繁更换会计师事务所，连续公告多项会计差错，五年时间里只是赚了一堆应收账款", "path": "马靖昊说会计_分类/财务指标解读/0055 频繁更换会计师事务所，连续公告多项会计差错，五年时间里只是赚了一堆应收账款.txt", "size": 12397, "excerpt": "美大丽阿宋：马老师，能否请您点评一下赛特斯（新三板832800）的财报? 马靖昊：您好，现就您的问题答复如下： 一、频繁更换会计师事务所，连续公告多项会计差错，财务数据真实性存疑 1、年报未按规定时限披露，拉响警报信号。 按照规定，上市公司2019年度报告本应在2020年4月30"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "关注“硬”的财务指标：花钱的数据最真实", "path": "马靖昊说会计_分类/财务指标解读/0058 关注“硬”的财务指标：花钱的数据最真实.txt", "size": 8272, "excerpt": "（一） 关注“硬”的财务指标：花钱的数据最真实 对企业真实经营情况进行判断，除了运用好财务报表的主流信息外，还要学会利用那些经过第三方验证的“硬数据”，也就是一些经常可能被忽视的非主流信息。这些信息对于判断企业营运状况以及投资价值有着不小的参考价值。 1、通过工资表判断企业的人才"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "谈谈应付账款", "path": "马靖昊说会计_分类/财务指标解读/0064 谈谈应付账款.txt", "size": 6884, "excerpt": "（一） 应付账款长期挂账是常见的一种情况，主要表现是企业应付账款中的一些明细款项长期未支付。有些明细款项可能属于合同或者诉讼纠纷，有些属于无力偿还，还有的属于供应单位可能消亡不存在。这些企业事实上无需支付的款项 ，可以作为营业外收入，而企业将其一直列为负债，属于虚列债务，从而对利"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "再谈应付账款！", "path": "马靖昊说会计_分类/财务指标解读/0065 再谈应付账款！.txt", "size": 8445, "excerpt": "（一） A公司的应付账款最近很烦躁，三天两头按到B公司应收账款的电话，这不趁早去紫竹院遛达散散心，真是怨家路窄，不期遇上了同样在此散心的B公司应收账款，难免又开始争执了。 应收账款说：老兄，求你了，我已列入一年期账龄监管起来了。应付账款说：兄弟，其实我想少还点，就拖着。应收账款说"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "谈谈往来科目！！！", "path": "马靖昊说会计_分类/财务指标解读/0067 谈谈往来科目！！！.txt", "size": 6190, "excerpt": "引言：往来科目，包括其他应收款、其他应付款、应收账款、应付账款、预收账款、预付账款。（一） 东西已经卖出去了，钱还在别人的兜里，就是应收账款；东西买进来了，钱还在自已的手里，就是应付账款；东西还没有卖，钱就到了自己兜里，这是预收账款；东西还没有买入，钱就到了别人的兜里，此为预付账"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "为什么珠江啤酒毛利率高而其净资产收益率低？", "path": "马靖昊说会计_分类/财务指标解读/0068 为什么珠江啤酒毛利率高而其净资产收益率低？.txt", "size": 6733, "excerpt": "2015年至2018年，该公司毛利率稳定在40%左右，与行业平均水平相当。2019年，该公司毛利率为46.84%，较2018年度大幅提升6.29个百分点，在所有A股啤酒上市公司中毛利率最高。 2020年前三季度，该公司毛利率进一步提升至51.57%，继续稳坐毛利率最高宝座，且拉开"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "谈谈应付职工薪酬", "path": "马靖昊说会计_分类/财务指标解读/0070 谈谈应付职工薪酬.txt", "size": 14721, "excerpt": "（一） 会计上有一个人见人爱的科目，大家都希望它计提时越大越好，它的名字叫“应付职工薪酬”。它核算的范围老广了，有工资、奖金、津贴和补贴；职工福利费；五险一金；工会经费和职工教育经费等传统意义上的薪酬，还有如辞退福利、带薪休假等职工薪酬形式。不过，核算再复杂，计提时贷记，发放时借"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "再谈往来科目！！！", "path": "马靖昊说会计_分类/财务指标解读/0072 再谈往来科目！！！.txt", "size": 6933, "excerpt": "（一） 某日听一位做奥迪特的筒子讲，查会计分录时查到“其他应收款-江湖救急”、“管理费用-董事长亲子鉴定”、“营业外支出-小秘借款”以及“管理费用-固定资产日常维护－老板健身卡年费”等明细科目，另外，还看到过“再见工程”科目。真笑死我了，做会计的童鞋，能不能不仲么油墨，不酱紫搞笑"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "谈谈最 “幸福” 的科目预收账款", "path": "马靖昊说会计_分类/财务指标解读/0073 谈谈最 “幸福” 的科目预收账款.txt", "size": 7400, "excerpt": "（一） 会计上有一个科目最“幸福”，它就是“预收账款”。CCTV要是懂会计，应该采访采访它。你看，货还没出去，钱就进来了，而且还是急不可耐地将钱打进来，生怕晚了货就没了。虽说表面上看起来它属愁煞人的负债，但它其实属于未来的收入，永远不用还钱，什么时候想要增点收入，给点货就OK了。"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "报表中的商誉根本就不是一项资产！！！", "path": "马靖昊说会计_分类/财务指标解读/0076 报表中的商誉根本就不是一项资产！！！.txt", "size": 19833, "excerpt": "（一） 报表中的商誉从严格意义上讲根本就不能属于资产，它不符合资产的定义，商誉不会导致未来现金流流入。商誉，究其根本，是并购中的一项亏损，是公司收购价超过被收购企业净资产公允价值的差额。商誉一直是报表中作为一项资产存在，这是不是掩人耳目？不过，如果被收购方情况不佳，就会天雷滚滚，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "谈谈净资产收益率！！！", "path": "马靖昊说会计_分类/财务指标解读/0081 谈谈净资产收益率！！！.txt", "size": 7353, "excerpt": "（一） 在杜邦分析法下，净资产收益率=净利润率*总资产周转率*权益乘数=净利润率*总资产周转率*【1/（1-资产负债率）】，表示它是用来衡量每单位净资产创造多少净利润的指标。 观察一家上市公司连续几年的净资产收益率表现，会发现一个有意思的现象：上市公司的净资产收益率往往在刚刚上市"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "企业的竞争优势除了更能赚钱外，还体现在对产业链上下游资金的占用上！", "path": "马靖昊说会计_分类/财务指标解读/0082 企业的竞争优势除了更能赚钱外，还体现在对产业链上下游资金的占用上！.txt", "size": 7047, "excerpt": "（一） 鉴于买卖关系中，一般是客户更强势，毕竟是掏钱方。因此，具备较大数额的预收账款更能体现企业的竞争优势。如果还能对上游产生应付账款，延迟支付，那么这家企业的资金运营效率就十分厉害了。 想象一下，如果开了一家公司，可以先进材料后付钱，然后还没卖产品就先收钱，这是多么美妙的事情啊"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "总资产收益率！！！", "path": "马靖昊说会计_分类/财务指标解读/0092 总资产收益率！！！.txt", "size": 7633, "excerpt": "（一） 根据总资产收益率ROA=净利润÷总资产=净利润÷（负债+所有者权益）；净资产收益率ROE=净利润÷所有者权益，当负债=0时，ROA=ROE。 这就说明，在企业管理中，一定要利用好负债，特别是无息负债，对于增加有息负债，也就是增加贷款，一方面会使收益增加，另一方面会使利息负"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "货币资金！！！", "path": "马靖昊说会计_分类/财务指标解读/0094 货币资金！！！.txt", "size": 12261, "excerpt": "（一） 为什么最近披露出来有不少上市公司直接通过虚增货币资金这种简单粗暴的方式造假呢？虚增货币资金，虽然看起来比较容易露出破绽，但相对于其他会计科目，操作起来要容易多了。 营业收入虚增，货币资金也随之虚增，直接对应，看起来更“合理”，如果选择其他资产的虚增进行对应，一是容易引起怀"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "如何通过现金流量表去寻找优质企业？", "path": "马靖昊说会计_分类/财务指标解读/0095 如何通过现金流量表去寻找优质企业？.txt", "size": 9102, "excerpt": "（一） 【如何通过现金流量表去寻找优质企业】1.经营活动产生的现金流量净额＞净利润，净利润为正数；2.销售商品、提供劳务收到的现金≥营业收入；3.投资活动产生的现金流量净额＜0，且主要是投入新项目，而非用于维持原有生产能力；4.现金及现金等价物净增加额＞0；5.期末现金及现金等价"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "终于明白神马是权益乘数了，大爱马老师！", "path": "马靖昊说会计_分类/财务指标解读/0097 终于明白神马是权益乘数了，大爱马老师！.txt", "size": 7915, "excerpt": "（一） 权益乘数就是资产将所有者权益放大的倍数，为什么要放大，做企业那肯定要琢磨以小搏大的策略，比如投入一元，你想搏动四元的资产，权益乘数就是4。那么另外三元从哪里来呢？当然是借来的了，它的资产负债率为75%。通常我们将权益乘数的以小搏大现象称之为财务杠杆，权益乘数越大，财务杠杆"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "自由现金流！！！", "path": "马靖昊说会计_分类/财务指标解读/0102 自由现金流！！！.txt", "size": 6274, "excerpt": "不同的人对自由现金流有不同的理解。但万变不离其宗，自由现金流代表了企业每年拥有可以自由支配的现金有多少。换句话说，在企业支付必要的运营成本费用（比如购买存货、支付员工工资和偿付应付账款）以及资本性支出（比如建造厂房、购买机器设备）后所剩余的现金流就是自由现金流。 自由现金流较为常"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "现金循环周期！！！", "path": "马靖昊说会计_分类/财务指标解读/0103 现金循环周期！！！.txt", "size": 7599, "excerpt": "现金循环周期是企业在营业活动中从付出现金到收到现金所需的平均时间。现金循环周期过程为：现金流出购买原材料，现金变为原材料及库存停留在企业内部，再变为销售的应收账款以及最终回款又变回现金。 一般来说，公司向供应商付款发生在向顾客收款之前，因为它持有存货（原材料、半成品和制成品）和应"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "马老师好，可否通俗的解说下递延所得税资产和递延所得税负债？", "path": "马靖昊说会计_分类/财务指标解读/0104 马老师好，可否通俗的解说下递延所得税资产和递延所得税负债？.txt", "size": 8989, "excerpt": "姜徽徽：马老师好，可否通俗的解说下递延所得税资产和递延所得税负债？ 马靖昊：好的！ 先不讲任何晦涩难懂的术语，这不是我马老师的风格，马老师就想将所有的财税东西说得谁都能懂。这样吧，先打一个比喻，所谓“递延所得税资产”和“递延所得税负债”好比“应交税费-应交所得税”的替身，比如应交"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "市净率与市盈率，帮您理解股市！！！", "path": "马靖昊说会计_分类/财务指标解读/0106 市净率与市盈率，帮您理解股市！！！.txt", "size": 8306, "excerpt": "（一） 【市净率与市盈率的区别是什么？】市净率PB＝总市值/净资产＝股价/每股净资产；市盈率PE＝总市值/净利润＝股价/每股收益（每股盈余）。 1.估值逻辑不同，在市净率的公式中，分母是每股净资产或全部净资产，也就是说市净率的估值逻辑是衡量一家公司有多少钱、值多少钱；在市盈率的公"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "毛利和毛利率！！！", "path": "马靖昊说会计_分类/财务指标解读/0107 毛利和毛利率！！！.txt", "size": 8098, "excerpt": "一 什么是毛利，毛利是指销售收入减去成本（销售成本或主营业务成本）的差额，它是没有拔毛的利润，企业内部人拔的毛就是管理费用、销售费用，国企一般下手较狠；银行拔的毛就是财务费用；政府拔的毛就是主营业务税金及附加、所得税费用。拔干净了，就成净利润。 有很多毛可以拔的一般是垄断企业或奢"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "马老师，可以讲解一下“盈余公积”这个科目吗？", "path": "马靖昊说会计_分类/财务指标解读/0109 马老师，可以讲解一下“盈余公积”这个科目吗？.txt", "size": 6761, "excerpt": "TINA会成功：马老师，可以讲解一下“盈余公积”这个科目吗？谢谢啦~马靖昊：No Problem！ 一、什么是盈余公积？ 盈余公积是指从净利润中提取的、具有特定用途的资金。公司制企业的盈余公积包括法定盈余公积和任意盈余公积。 1、法定盈余公积根据《公司法》第一百六十六条，公司分配"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "什么样的非财务信息可以用来判断企业陷入财务困境", "path": "马靖昊说会计_分类/财务指标解读/0111 什么样的非财务信息可以用来判断企业陷入财务困境.txt", "size": 6190, "excerpt": "一、问题的引出 裁员是判断一个公司财务恶化的最直接信号。现在企业用工成本很高，当企业增长乏力，商业模式不清晰，未来走向不明朗时，自救的最佳方式就是采用N+1的补偿制度（N指工作年限，外加一个月工资）进行裁员。比如最近乐视现金流恶化，其自救的最直接有效方式就是大规模裁人，特别是拿大"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "存货周转率（存货周转天数）！！！", "path": "马靖昊说会计_分类/财务指标解读/0113 存货周转率（存货周转天数）！！！.txt", "size": 8800, "excerpt": "（一） 在通常情况下，存货周转率下降，表明公司存货项目的资金占用增长过快，超过了其产品销售增长速度，其毛利率应趋同下降才合理，同时，存货周转率下降也说明了产品竞争力下降，竞争力不强，毛利率也必然下降。 如果你发现某上市公司存货周转率逐年下降而毛利率却逐年上升这种背道而行的现象，要"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "其他综合收益！！！", "path": "马靖昊说会计_分类/财务指标解读/0114 其他综合收益！！！.txt", "size": 7449, "excerpt": "由于公允价值的概念被运用了，才有其他综合收益。 “其他综合收益”指公司在持有资产的过程中因资产价格波动形成的账面收益，也就是它未在利润表中作为“利润”确认，而是在资产负债表中作为“所有者权益”确认。比如持有股票，如果打算长期持有，那价值波动就不影响当期损益，而是计入其他综合收益。"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "应付账款周转率！！！", "path": "马靖昊说会计_分类/财务指标解读/0116 应付账款周转率！！！.txt", "size": 5767, "excerpt": "应付账款周转率反映本企业免费占用供应商资金的能力，它代表公司的一种信用，一般来讲，该指标越慢越好。通过同行业比较，从应付账款周转率也能看出一个企业的行业地位，如公司应付账款周转率低于行业平均水平，说明公司较同行业其他企业，可以占用更多的供货商货款，表明其市场地位较高，但也不是绝对"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "现金流危急时的关键一招！", "path": "马靖昊说会计_分类/财务指标解读/0120 现金流危急时的关键一招！.txt", "size": 7518, "excerpt": "（一） 【现金流危急时的关键一招！】如果公司遇到现金流危机，账上没几个子了，而又要支付供应商款项，咋办？对于关系好的供应商好对付，将支票的日期尽量往后开就可以；但对于那些关系不太好的供应商，则安排出纳开支票时留下伏笔，就是每张票上留下一点小毛病。这些毛病客户看起来没问题，但银行会"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "分析企业资本性支出要关注的四个指标！", "path": "马靖昊说会计_分类/财务指标解读/0125 分析企业资本性支出要关注的四个指标！.txt", "size": 8112, "excerpt": "（一） 【分析企业资本性支出要关注的四个指标】资本性支出指的是企业构建固定资产、无形资产以及其他长期性资产的支出。可以直接从现金流量表中“构建固定资产、无形资产和其他长期资产支付的现金”项目中提取，资本性支出的核心在于通过对于长期性资产的投资，将企业的产能提升一个台阶，从而为企业"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "从长期应付款看，一家企业是否缺钱？", "path": "马靖昊说会计_分类/财务指标解读/0127 从长期应付款看，一家企业是否缺钱？.txt", "size": 7127, "excerpt": "一、长期应付账款简介 长期应付款，是指企业除了长期借款和应付债券以外的其他各种长期应付款，付款期限均在1年以上。长期应付款一般包括以下内容： 1、采用补偿贸易方式而发生的应付引进设备款。补偿贸易是从国外引进设备，再用该设备生产的产品归还设备价款。 2、应付融资租入固定资产租赁费。"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "永续债的记账反映了会计的魔术性！！！", "path": "马靖昊说会计_分类/财务指标解读/0128 永续债的记账反映了会计的魔术性！！！.txt", "size": 7268, "excerpt": "什么叫永续债？ 永续债又称无期债券，是指可被发行人无限延期的债券。永续债发行人拥有赎回或延期的选择权，并在不触发强制付息条款的前提下拥有递延付息决定权。永续债持有人没有要求清偿本金的权利，但可以按期取得利息。理论而言，永续债发行人可以在每一个行权日将永续债不断延期，实现“永续”的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "不少上市公司的商誉减值，就是赤裸裸的行骗！", "path": "马靖昊说会计_分类/财务指标解读/0129 不少上市公司的商誉减值，就是赤裸裸的行骗！.txt", "size": 8051, "excerpt": "（一） 不少上市公司的商誉减值，就是赤裸裸的行骗！上市公司一般通过被并购方的高业绩承诺来获得高商誉并购的通行证，由于配套的业绩承诺是采用赚取利润的数额，而不是赚取现金的数额，这样，在承诺期内，被并购方将会运用各种手段虚增利润以兑现所谓的业绩承诺。 等到承诺期结束，各方利益都已落袋"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "静态、动态、滚动市盈率的区别", "path": "马靖昊说会计_分类/财务指标解读/0131 静态、动态、滚动市盈率的区别.txt", "size": 8141, "excerpt": "（一） 【静态市盈率、动态市盈率以及滚动市盈率的区别】市盈率=股价/每股预期收益=当前市值/净利润，用人话来说，市盈率就是根据公司的盈利情况，你要付出多少价格才能买下这家公司，我们当然是希望付出的价格越低越好，所以市盈率越低，说明当前股票越低估。 打个比方，一只股票的市盈率是10"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "企业之间的竞争，其实是现金流之战！", "path": "马靖昊说会计_分类/财务指标解读/0136 企业之间的竞争，其实是现金流之战！.txt", "size": 6946, "excerpt": "（一） 企业之间的竞争，表面上看起来是市场份额之战，是利润之战，但从财务角度上看，其实是现金流之战！谁的现金流被打掉，谁的底裤就立刻被扒下！理论上说，只要有现金流，亏损也没关系！ 比如一家企业一年现金流50亿元，每年亏500万元。那么，它亏个几百年都没问题，因为20年才亏1亿，1"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "什么是真正的资产负债率？", "path": "马靖昊说会计_分类/财务指标解读/0138 什么是真正的资产负债率？.txt", "size": 7841, "excerpt": "（一） 在财报中，有一些被记录为资产的东西，既不能独立存在，也不能单独变现，更不能用来偿债，比如，并购溢价形成的商誉、递延所得税资产、长期待摊费用等。其实这些资产从严格意义讲，都是费用。因此，资产负债表中是记录“费用”的，在财报分析时，要考虑扣除这些资本化的“费用”。比如资产负债"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "英科医疗：市盈率不到5，产能比去年翻了一番，净利有150亿！到底如何？", "path": "马靖昊说会计_分类/财务指标解读/0141 英科医疗：市盈率不到5，产能比去年翻了一番，净利有150亿！到底如何？.txt", "size": 6395, "excerpt": "茅台伴侣片子癀：马老师，请您分析手套王英科医疗市盈率不到5，产能比去年翻一番，净利有150亿！与中红，蓝帆对比怎样？ 马靖昊：好的，现分析如下： 2020年，英科医疗的营业收入从此前的20亿元左右，猛然飙升到138亿元，同比增长6倍，归属净利润从此前的1.8亿元，暴涨至70亿元，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "企业高质量发展就是要具备持续创造自由现金流的能力！", "path": "马靖昊说会计_分类/财务指标解读/0142 企业高质量发展就是要具备持续创造自由现金流的能力！.txt", "size": 6686, "excerpt": "（一） 宏观经济的高质量发展最终到落实于微观企业的高质量发展，从财务的角度，单纯追求利润会透支未来，单纯追求销售收入的增长而带来巨额应收账款简直就是疯 "size": 6509, "excerpt": "一 【分析现金流量表主要抓住三点】 1、经营性现金流入与销售收入比，分析其销售收入质量，收入的真实性； 2、经营性净现金流与净利润比，分析其盈利质量，盈利的真实性，如果经营性净现金流长期为负值，或是经营性净现金流之和长期低于净利润之和，那么企业资产负债表上肯定有一部分资产是虚构；"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "营业收入！！！", "path": "马靖昊说会计_分类/财务指标解读/0168 营业收入！！！.txt", "size": 8077, "excerpt": "（一） 一家企业如果应收账款占总资产比重大，对企业的发展是极其不利的。应收账款就是客户拿了东西，钱还在客户手中。这样，虽然营业收入是算进来了，但是现金却没到自己手上。这些营业收入纯属白条收入，没有现金流入。 如果账面上只剩下可怜的一点货币资金，真不知道企业能否持续经营下去，这就是"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "净资产收益率！！！", "path": "马靖昊说会计_分类/财务指标解读/0169 净资产收益率！！！.txt", "size": 7200, "excerpt": "（一） 在杜邦分析法下，净资产收益率=净利润率*总资产周转率*权益乘数=净利润率*总资产周转率*【1/（1-资产负债率）】，表示它是用来衡量每单位净资产创造多少净利润的指标。 观察一家上市公司连续几年的净资产收益率表现，会发现一个有意思的现象：上市公司的净资产收益率往往在刚刚上市"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "营业外收入！！！", "path": "马靖昊说会计_分类/财务指标解读/0170 营业外收入！！！.txt", "size": 4908, "excerpt": "一 大家肯定都听过“守株待兔”的寓言故事，说的是宋国有个农夫，他的田地中有一截树桩，一天，一只跑得飞快的野兔撞在树桩上，被扭断了脖子，死了，这位农夫捡到后，美餐了一顿。 这本来类似于“天上掉馅饼”的事情，属于一个很偶然的所得，即所谓会计上的“营业外收入”，但这位农夫最终却干脆什么"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "潜亏！！！", "path": "马靖昊说会计_分类/财务指标解读/0173 潜亏！！！.txt", "size": 6232, "excerpt": "一 潜亏，就是潜伏着的亏损，本质上，是将费用潜伏起来，那么这些费用到底潜伏在什么地方呢？ 1.在账内潜伏，也就是那些披上资产外衣的费用，也称之为“资产水分”，它实际上是费用，但没有让它进利润表，而在资产方潜伏起来了，比如应收账款、其他应收款、存货、长期股权投资、在建工程、固定资产"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "不管你信不信，积压的存货会带来毛利率的上升！", "path": "马靖昊说会计_分类/财务指标解读/0177 不管你信不信，积压的存货会带来毛利率的上升！.txt", "size": 7824, "excerpt": "（一） 不管你信不信，积压的存货会带来毛利率的上升！存货，从实物形态来说，是产成品，半成品，原材料等，积压了卖不掉肯定不是好事，这个很好理解。但是从财报角度来看，毛利=销售收入- 产品成本 =（销售单价—单位产品成本） *销量，单位产品成本 =单位固定成本+单位变动成本。 奥秘就"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "毛利率！！！", "path": "马靖昊说会计_分类/财务指标解读/0180 毛利率！！！.txt", "size": 8358, "excerpt": "（一） 分析财报时，毛利率是一个很重要的指标，毛利率太高就会怀疑你财务做假，太低又说明产品竞争力不强。因此，太高或太低都不正常，这不算悖论，而是符合自然规律。比如大家100米赛跑正常成绩在10秒到15秒之间，你要是跑个5秒或是30秒都是不正常的，因为跑5秒超过人的生理极限，而跑3"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "自由现金流最简明计算方法！", "path": "马靖昊说会计_分类/财务指标解读/0183 自由现金流最简明计算方法！.txt", "size": 6052, "excerpt": "（一） 自由现金流就是企业经营活动产生的、在满足了再投资需求之后剩余的现金流。自由现金流是企业可自由支配的现金流，有了自由现金流，企业才能把钱用于还本付息、为股东派发股利。最简明计算方法：现金流量表中的“经营活动产生的现金流量净额”减去“购建固定资产、无形资产和其他长期资产支付的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "现金循环周期​指标揭示了管理资产负债表的重要意义！", "path": "马靖昊说会计_分类/财务指标解读/0184 现金循环周期​指标揭示了管理资产负债表的重要意义！.txt", "size": 6745, "excerpt": "现金循环周期是指从支付原材料货款开始到最终收回本公司货款为止的时间过程。现金循环周期过程为：现金流出购买原材料，现金变为原材料及库存停留在企业内部，再变为销售的应收款以及最终回款又变回现金。 其实，现金循环周期与马克思讲的货币资本循环的概念是一致的，马克思说，产业资本家总是首先把"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "“按需”报送财务报告风险极大", "path": "马靖昊说会计_分类/财务指标解读/0185 “按需”报送财务报告风险极大.txt", "size": 4335, "excerpt": "7月30日下午，在国务院新闻办举行的财政支持全面建成小康社会新闻发布会上，有记者提问：最近，瑞幸咖啡财务造假和德勤员工举报等事件备受社会关注，进一步凸显了加强财会监督的重要性。请问，财政部在加强财会监督方面有什么考虑？ 财政部副部长朱忠明回答，加强财会监督是贯彻中央重大决策部署的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "经营活动现金流量！！！", "path": "马靖昊说会计_分类/财务指标解读/0187 经营活动现金流量！！！.txt", "size": 7231, "excerpt": "（一） 【将净利润调整为经营活动现金流量净额】经营活动现金净流量=净利润+处置固定资产、无形资产和其他长期资产的损失（减收益）+固定资产报废损失（减收益）+财务费用（利息支出-筹资活动利息收入）+投资活动的投资损失（减收益）+计提的资产减值准备+固定资产折旧+摊销+长期待摊费用摊"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "库存的本质是什么？", "path": "马靖昊说会计_分类/财务指标解读/0189 库存的本质是什么？.txt", "size": 6450, "excerpt": "（一） 库存的本质是什么？它不仅仅是资金周转中的一种形态，根本上它是企业创新能力不足和市场地位弱的反映。这样的企业才会把\"货币\"堆放在仓库里，而且越堆越多，让企业在不知不觉中陷入痛苦的深渊，最终库存跌价，甚至低于成本价，只好计提\"存货跌价准备\"，真是糟蹋钱还搭上瞎忙活，库存是亏损"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "盈利能力！！！", "path": "马靖昊说会计_分类/财务指标解读/0195 盈利能力！！！.txt", "size": 7380, "excerpt": "一 在排除假利润的前提下，盈利能力是一个企业的核心竞争力，例如银行或战略投资者决定是否给予一家企业贷款或投资时，考虑的核心因素就是考虑该企业的盈利能力，即该企业是否有好的盈利资产，是否具有一定的盈利能力。通过利润表我们经常计算的指标有毛利率、营业利润率和净利率。它们的计算公式如下"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "不管你信不信，积压的存货会带来毛利率的上升！", "path": "马靖昊说会计_分类/财务指标解读/0201 不管你信不信，积压的存货会带来毛利率的上升！.txt", "size": 5822, "excerpt": "一 公司的存货包括产品库存、生产原料库存等，存货过多会影响到公司下一报告期的生产和运营。上市公司产品库存多的可能性：1.产品销售遇到了困难，竞争力下降，产品跌价风险高。2.可能未计提或少计提了存货跌价准备。3.存货可能未及时结转为成本，以虚增利润；4.部分存货可能子虚乌有，可能为"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "马老师，有什么好的方法迅速切入一家上市公司展开分析？", "path": "马靖昊说会计_分类/财务指标解读/0202 马老师，有什么好的方法迅速切入一家上市公司展开分析？.txt", "size": 6486, "excerpt": "有一位网名叫“学财务的小瓜”的朋友在微博回答中提问：请问马老师，财务分析，尤其是每年年度大戏—A股上市公司年报，有什么好的方法迅速切入一家公司展开分析？ 您好，这个问题非常好，一家上市公司的年报少则一百多页多则几百页，如何从纷繁复杂的年报中提取有用信息，是投资者非常关心的话题。从"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "销售费用率改称为“销售难度率”，更便于理解！", "path": "马靖昊说会计_分类/财务指标解读/0204 销售费用率改称为“销售难度率”，更便于理解！.txt", "size": 5577, "excerpt": "销售费用率是指公司的销售费用与营业收入的比率，销售费用率体现了企业为取得单位收入所花费的单位销售费用，或者销售费用占据了营业收入的多大比例。 销售费用率主要看两点，数值和变动趋势。 一般来说，销售费用率小于 15%的公司，其产品比较容易销售，销售风险相对较小。销售费用率大于 30"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "毛利率！！！", "path": "马靖昊说会计_分类/财务指标解读/0209 毛利率！！！.txt", "size": 6090, "excerpt": "（一）毛利率是体现一家企业产成品的市场价值相对于其原始生产过程中所发生的成本的溢价能力，高毛利就是产品具有高附加值。但高毛利率并不一定带来高净利润率，毛利还需要经过管理费用、销售费用、财务费用、所得税费用等一系列“拔毛”后，才能剥出净利润来，从这个“拔毛”的过程可以看出一家企业的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "企业的经营就是一场收入与成本费用之间的战斗！！！", "path": "马靖昊说会计_分类/财务指标解读/0214 企业的经营就是一场收入与成本费用之间的战斗！！！.txt", "size": 8288, "excerpt": "（一）企业持有的所有资产，从长期来看最终都要被消耗掉的，而消耗这些资产的最终目的是为了赚取更多的钱，当然，也可能事与愿违，不但没赚到钱，反而连本都亏没了。企业被耗费的资产，要么成为企业利润表中的经营费用，要么通过存货的销售成为利润表中的销售成本，企业的经营就是一场收入与成本费用之"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "什么样的非财务信息可以用来判断企业陷入财务困境", "path": "马靖昊说会计_分类/财务指标解读/0215 什么样的非财务信息可以用来判断企业陷入财务困境.txt", "size": 6191, "excerpt": "一、问题的引出 裁员是判断一个公司财务恶化的最直接信号。现在企业用工成本很高，当企业增长乏力，商业模式不清晰，未来走向不明朗时，自救的最佳方式就是采用N+1的补偿制度（N指工作年限，外加一个月工资）进行裁员。比如最近乐视现金流恶化，其自救的最直接有效方式就是大规模裁人，特别是拿大"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "谈谈制造费用、生产成本与库存商品之间的关系", "path": "马靖昊说会计_分类/财务指标解读/0220 谈谈制造费用、生产成本与库存商品之间的关系.txt", "size": 7069, "excerpt": "一 制造费用、生产成本与库存商品之间的关系 1. 制造费用（1）概念：是指企业生产车间为生产产品和提供劳务而发生的各项间接费用，如生产车间发生的办公费、水电费等，是构成产品成本的一部分。（2）性质：生产车间制造过程中发生的费用，由产品来承担，构成产品的成本，属于成本类，作为存货的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "实例：上市公司的商誉已成为套取资金的黑洞", "path": "马靖昊说会计_分类/财务指标解读/0222 实例：上市公司的商誉已成为套取资金的黑洞.txt", "size": 8237, "excerpt": "不少上市公司的商誉减值，就是赤裸裸的行骗！上市公司一般通过被并购方的高业绩承诺来获得高商誉并购的通行证，由于配套的业绩承诺是采用赚取利润的数额，而不是赚取现金的数额，这样，在承诺期内，被并购方将会运用各种手段虚增利润以兑现所谓的业绩承诺。 等到承诺期结束，各方利益都已落袋为安了，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "现金流量表！！！", "path": "马靖昊说会计_分类/财务指标解读/0225 现金流量表！！！.txt", "size": 9235, "excerpt": "（一） 2011-12-8 14:44 为什么现金流量表编制起来大家都说难呢？因为会计制度没给你设计一套\"现金流量账户\"，当你手工编制时，需要对现金类与非现金类之间发生的分录进行分析，按照经营活动、投资活动、筹资活动中的每一个项目的具体内容进行填列，实际上，你在编制时，就是在做一"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "对于巨额商誉减值损失，要有人承担责任！", "path": "马靖昊说会计_分类/财务指标解读/0227 对于巨额商誉减值损失，要有人承担责任！.txt", "size": 5952, "excerpt": "一 对上市公司由于“买买买”而导致的账面高商誉要实行责任制，对于收购垃圾资产、问题资产而导致的巨额商誉减值损失，应追究主要责任人及有关当事人责任。比如，赔偿企业损失，依法追究有关责任人、当事人背信损害上市公司利益罪等，绝不能放任上市公司董监高以“买买买”之名，以买亏了的巨额商誉之"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "债！！！", "path": "马靖昊说会计_分类/财务指标解读/0230 债！！！.txt", "size": 5559, "excerpt": "（一） 企业不缺钱、不借债才牛！但企业缺钱时能够融到钱，企业至少还能活下去，但要分析这些钱用的合不合理，也就是债务杠杆是否发挥了最大效能。具体可以用有息负债占总资产的比例变动与资产周转率变动做作对比，如果一个公司有息负债占资产比例提升迅速，但是资产周转率却没有提升；同时，公司的毛"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "偿债！！！", "path": "马靖昊说会计_分类/财务指标解读/0231 偿债！！！.txt", "size": 7481, "excerpt": "引言：衡量偿债能力的主要指标是资产负债率，其他还包括流动比率（营运资金）、速动比率、利息保障系数等，当然还可以通过对现金偿债能力进行分析作为辅助。一【现金偿债能力分析】在分析企业的偿债能力时，除了常用的资产负债率之外，还可以通过比较“扣除受限金额后的准货币资金”和“有息负债总额”"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "马老师好，可否通俗的解说下递延所得税资产和递延所得税负债？", "path": "马靖昊说会计_分类/财务指标解读/0235 马老师好，可否通俗的解说下递延所得税资产和递延所得税负债？.txt", "size": 6877, "excerpt": "姜徽徽：马老师好，可否通俗的解说下递延所得税资产和递延所得税负债？马靖昊：好的！ 先不讲任何晦涩难懂的术语，这不是我马老师的风格，马老师就想将所有的财税东西说得谁都能懂。这样吧，先打一个比喻，所谓“递延所得税资产”和“递延所得税负债”好比“应交税费-应交所得税”的替身，比如应交税"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "营运资金！！！", "path": "马靖昊说会计_分类/财务指标解读/0237 营运资金！！！.txt", "size": 8756, "excerpt": "地球上的财务人都知道，营运资金=流动资产-流动负债。 不过，对于营运资金，不少大学教授们会不负责任地告诉你，营运资金越大对企业越有利，说明这样的企业有很好的流动性、很强的短期偿债能力、短期财务风险低。原因是大多数教材是这样描述营运资金的作用： 营运资金可以用来衡量公司或企业的短期"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "其他综合收益！！！", "path": "马靖昊说会计_分类/财务指标解读/0242 其他综合收益！！！.txt", "size": 8011, "excerpt": "由于公允价值的概念被运用了，才有其他综合收益。 “其他综合收益”指公司在持有资产的过程中因资产价格波动形成的账面收益，也就是它未在利润表中作为“利润”确认，而是在资产负债表中作为“所有者权益”确认。比如持有股票，如果打算长期持有，那价值波动就不影响当期损益，而是计入其他综合收益。"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "资产负债率！！！", "path": "马靖昊说会计_分类/财务指标解读/0244 资产负债率！！！.txt", "size": 6382, "excerpt": "（一）资产负债率=负债总额/资产总额，反映资产对债务的偿还保障程度和债务对资产的资金支撑程度。一般而言：1.债权人要求此比率越低越好；2.在总资本报酬率＞借入资本利息率前提下，股东要求此比率越高越好；3.经营者要求保持恰当的资本结构，一般认为应维持在50%左右，当然,行业性质不同"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "会计最容易混淆的10个财务常识！", "path": "马靖昊说会计_分类/财务指标解读/0247 会计最容易混淆的10个财务常识！.txt", "size": 9114, "excerpt": "·alt1 账面价值、账面余额和账面净值 账面价值是指某科目(通常是资产类科目)的账面余额减去相关备抵项目后的净额。 账面余额是指某科目的账面实际余额，不扣除作为该科目备抵的项目。 账面净值是指固定资产的折余价值=固定资产原价-计提的累计折旧(不扣除减值准备金额) 例如：2018"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "净资产收益率的缺陷！！！", "path": "马靖昊说会计_分类/财务指标解读/0250 净资产收益率的缺陷！！！.txt", "size": 5767, "excerpt": "·alt净资产收益率是一家公司税后利润除以净资产得到的百分比，许多人把ROE作为衡量公司业绩的一个标准，但应注意ROE存在如下缺陷： 1、这个指标的分子用的是企业净利润来计算的，但企业净利润多半是虚的，说不清楚。用含金量低的净利润计算出来的净资产收益率可能具有欺骗性。 2、这个指"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "资产负债率能衡量企业的债务风险吗？！", "path": "马靖昊说会计_分类/财务指标解读/0251 资产负债率能衡量企业的债务风险吗？！.txt", "size": 6077, "excerpt": "·alt前二年，看到某企业的资产负债率超过80%了，比同行业平均水平还高了近20个点，表面看起来偿债能力较弱。不过，再细看资产负债表，负债项里预收账款高达6200万元，与1200万元的短期借款、600万元的应付账款、200万元的其他应付款相比，显得过于鹤立鸡群，这其实根本就不存在"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "从恒瑞医药研发费用资本化谈起......", "path": "马靖昊说会计_分类/财务指标解读/0252 从恒瑞医药研发费用资本化谈起.......txt", "size": 6460, "excerpt": "·altaltalt一 恒瑞医药研发费用资本化：对于一家药企来说，不创新没有长期的持续研发就没有未来。恒瑞医药之前的做法对所有的研发费用100%费用化处理，但从去年11月开始，面对集采竞争以及高研发投入的双重压力，恒瑞医药进行了会计估计变更，将研发100%费用化转为资本化。资本化"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "总资产收益率！！！", "path": "马靖昊说会计_分类/财务指标解读/0253 总资产收益率！！！.txt", "size": 9382, "excerpt": "·alt一 总资产收益率可以作为分析资产盈利能力的一个指标，但不能作为一个管理上的考核指标。先给大家举一个例子说明：假定某企业有净资产100 万元，银行贷款 100 万元，清偿完银行贷款利息并纳完税后的纯收益为20万元，总资产收益率为10%，净资产收益率为20%。假设企业再从银行"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "市净率与市盈率，帮您理解股市！！！", "path": "马靖昊说会计_分类/财务指标解读/0254 市净率与市盈率，帮您理解股市！！！.txt", "size": 8666, "excerpt": "·alt·一【市净率与市盈率的区别是什么？】市净率PB＝总市值/净资产＝股价/每股净资产；市盈率PE＝总市值/净利润＝股价/每股收益（每股盈余）。 1.估值逻辑不同，在市净率的公式中，分母是每股净资产或全部净资产，也就是说市净率的估值逻辑是衡量一家公司有多少钱、值多少钱；在市盈率"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "杜邦公式其实告诉了CEO如何才能经营好企业", "path": "马靖昊说会计_分类/财务指标解读/0258 杜邦公式其实告诉了CEO如何才能经营好企业.txt", "size": 4630, "excerpt": "·alt董事会对企业CEO的业绩评估一般以净资产回报率为主要标准，而对净资产回报率的分解就是如下的杜邦公式： 净资产回报率=(净利润/股东权益)=(净利润/总资产)×(总资产/股东权益)=(净利润/销售收入)×(销售收入/总资产)×(总资产/股东权益)=销售净利率×资产周转率×财"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "潜亏，潜伏的亏损！", "path": "马靖昊说会计_分类/财务指标解读/0259 潜亏，潜伏的亏损！.txt", "size": 6704, "excerpt": "·alt一 潜亏，就是潜伏着的亏损，本质上，是将费用潜伏起来，那么这些费用到底潜伏在什么地方呢？ 1.在账内潜伏，也就是那些披上资产外衣的费用，也称之为“资产水分”，它实际上是费用，但没有让它进利润表，而在资产方潜伏起来了，比如应收账款、其他应收款、存货、长期股权投资、在建工程、"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "费用！！！", "path": "马靖昊说会计_分类/财务指标解读/0262 费用！！！.txt", "size": 5346, "excerpt": "·（一） 费用一般称为“三费”，包括销售费用、管理费用和财务费用，我们在计算企业费用率时，不能简单地认为费用率=（销售费用+管理费用+财务费用）÷营业收入，而是要单独考虑财务费用的正负情形。如果财务费用是正数（利息收支相抵后，是净支出），就把它和销售、管理费用加总一起除以营业收入"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "对于一家企业成长性的分析！！！", "path": "马靖昊说会计_分类/财务指标解读/0263 对于一家企业成长性的分析！！！.txt", "size": 5710, "excerpt": "·一家企业成长性分析的目的在于观察该企业在一定时期内的经营能力发展状况。一家企业即使收益很好，但如成长性不好，也不会很好地吸引投资者。 对于一家企业成长性的分析，主要应分析其经营现金流增速、净利润增速、销售收入增速、净资产增速以及总资产增速等指标。一般而言，这些指标为正，表明企业"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "现金循环周期！！！", "path": "马靖昊说会计_分类/财务指标解读/0265 现金循环周期！！！.txt", "size": 7089, "excerpt": "（一） 【@emptyy77:一个需贷款的企业现金循环周期为负，合理吗？】从补充营运资金的角度来讲，不合理！现金循环周期＝存货周转天数＋应收帐款周转天数－应付帐款递延天数，现金循环周期越长，需要的短期贷款越多。现金周期为负则说明应收账款、存货的周转天数很短，应付账款递延天数很长，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "净资产收益率的计算方法", "path": "马靖昊说会计_分类/财务指标解读/0268 净资产收益率的计算方法.txt", "size": 9920, "excerpt": "一、关于ROE的传统计算方法 第一个公式，ROE=净利润/净资产，这公式就是ROE的定义，非常直观。根据用途，ROE还可以细分为：一种是全面摊薄ROE，ROE=净利润/期末净资产；另一种是加权ROE，ROE=净利润/（期初和期末净资产的平均值）。经营者喜欢摊薄ROE，投资者喜欢加"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "关注“硬”的财务指标：花钱的数据最真实", "path": "马靖昊说会计_分类/财务指标解读/0270 关注“硬”的财务指标：花钱的数据最真实.txt", "size": 10126, "excerpt": "（一）关注“硬”的财务指标：花钱的数据最真实对企业真实经营情况进行判断，除了运用好财务报表的主流信息外，还要学会利用那些经过第三方验证的“硬数据”，也就是一些经常可能被忽视的非主流信息。这些信息对于判断企业营运状况以及投资价值有着不小的参考价值。 1、通过工资表判断企业的人才竞争"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "脾气大的人居然与会计科目有那么多的关联！！！", "path": "马靖昊说会计_分类/财务指标解读/0272 脾气大的人居然与会计科目有那么多的关联！！！.txt", "size": 3152, "excerpt": "引言：这是本人早期写的会计调侃体，发在这里供大伙一阅。 1、脾气大的人心最软！——好比“应收账款”，脾气再大，也得称对方“应付账款”为“大爷”，不断地求他赶紧还款，只要他还认这笔账。2、脾气大的人不记仇！——好比流动资产减值转回，发完脾气了，就允许转回来；而不象非流动性资产减值，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "商誉！", "path": "马靖昊说会计_分类/财务指标解读/0275 商誉！.txt", "size": 8892, "excerpt": "关于商誉的一场讨论 在2006年以前，我国将商誉在确认后按照10年平均摊销计入损益。2006年我国为了与国际会计准则趋同，对商誉不再要求摊销，改为减值测算的处理方式。理由为：由于商誉摊销会对盈余产生连续多年的影响，不能如实地反映商誉所代表的超额盈利能力的变化，也未考虑商誉可能的不"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "要警惕将「并购商誉」隐藏起来", "path": "马靖昊说会计_分类/财务指标解读/0279 要警惕将「并购商誉」隐藏起来.txt", "size": 6367, "excerpt": "【要警惕将并购商誉隐藏起来】一家上市公司并购一家企业，长期股权投资初始成本是按照上市公司支付对价的公允价值确定的，多付了钱，也就是买亏了，就确认为商誉。由于商誉常常暴雷，投资者目前对商誉都保有一颗警惕的心。因此，有些上市公司通过评估机构调高可辨认净资产的价值，将大部分商誉甚至全部"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "现金流量！！！", "path": "马靖昊说会计_分类/财务指标解读/0280 现金流量！！！.txt", "size": 8249, "excerpt": "现金流量是反应公司在一定时期，通过一定经济活动而产生的现金流入、现金流出及其总量情况。现金流量就像企业的血液一样，可以反映公司利润的质量、判断公司财务状况是否健康。 相马座牛之徒：如何判断一家上市公司现金流质量？ 马靖昊：判断一家上市公司现金流的好坏，主要可以关注净现比、收现比两"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "总资产收益率与净资产收益率的区别与联系", "path": "马靖昊说会计_分类/财务指标解读/0282 总资产收益率与净资产收益率的区别与联系.txt", "size": 7128, "excerpt": "总资产收益率与净资产收益率的区别与联系： 1.计算公式区别：总资产收益率=净利润÷平均资产总额(平均负债总额十平均所有者权益)×100%，ROA的高低直接反映了公司的竞争实力和发展能力，也是决定公司是否应举债经营的重要依据；净资产收益率=净利润*2/（本年期初净资产+本年期末净资"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "现金流的威力，不可不知对应收账款管理的重要性！", "path": "马靖昊说会计_分类/财务指标解读/0283 现金流的威力，不可不知对应收账款管理的重要性！.txt", "size": 8919, "excerpt": "现金流的威力 现在开始分享“现金流”的故事…… 一个游客路过一个小镇，他走进一家旅馆给了店主1000元现金，挑了一个房间，他上楼以后，店主拿这1000元给了对门的屠夫支付了这个月的肉钱；屠夫去养猪的农夫家里把欠的买猪款付清了，农夫还了饲料钱，饲料商贩还清了赌债，赌徒赶紧去旅馆还了"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "企业造血与失血：自由现金流的分析", "path": "马靖昊说会计_分类/财务指标解读/0284 企业造血与失血：自由现金流的分析.txt", "size": 6309, "excerpt": "【自由现金流的分析】自由现金流是企业经营活动产生的，在满足日常生产经营和扩大再生产需要之后，剩余的可供企业分配的现金流，自由现金流=经营性净现金流-资本性支出。通过分析自由现金流可以知道：1、企业的投资资金来自于哪里；2、股东分红的钱来自于哪里。如果一家上市公司自由现金流充裕，却"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "库存的本质是什么？", "path": "马靖昊说会计_分类/财务指标解读/0287 库存的本质是什么？.txt", "size": 6874, "excerpt": "库存的本质是什么（这里的库存不包括具有较大增值性的存货）？它不仅仅是资金周转中的一种形态，根本上它是企业创新能力不足和市场地位弱的反映。这样的企业才会把\"货币\"堆放在仓库里，而且越堆越多，让企业在不知不觉中陷入痛苦的深渊，最终库存价格下跌，甚至低于成本价，只好计提\"存货跌价准备\""}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "用会计术语吵架，要笑喷了！", "path": "马靖昊说会计_分类/财务指标解读/0288 用会计术语吵架，要笑喷了！.txt", "size": 6731, "excerpt": "引言：这是我在多年前写的文字，最近发现不少公众号都在转载，我一直认为，只要传播对会计人有用、好玩的东西，就是一件好事，但有一点小遗憾，就是很少有公众号标注出处。今天，我再归整归整一下，发在这里，供大家阅读。 会计学的知识真是万能的，既可以用于爱情的表白，也可以用于吵架。不信，请看"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "净资产收益率！！！", "path": "马靖昊说会计_分类/财务指标解读/0294 净资产收益率！！！.txt", "size": 7629, "excerpt": "在杜邦分析法下，净资产收益率=净利润率*总资产周转率*权益乘数=净利润率*总资产周转率*【1/（1-资产负债率）】，表示它是用来衡量每单位净资产创造多少净利润的指标。观察一家上市公司连续几年的净资产收益率表现，会发现一个有意思的现象：上市公司的净资产收益率往往在刚刚上市的几年中都"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "股市：要关注这九个指标！", "path": "马靖昊说会计_分类/财务指标解读/0297 股市：要关注这九个指标！.txt", "size": 16391, "excerpt": "第一个指标：ROE，即净资产收益率 净资产收益率=净利润/净资产。 有一位网友问我：“马老师，如果你收购企业的时候只关注一个指标，那你会选择哪一个？”我的回答是：“净资产收益率”。巴菲特应该也是这样认为的，它曾经表示，净资产收益率是衡量一家公司经营业绩的最佳指标！而不是收入增长率"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "自由现金流以及现金流量表分析的要点！！！", "path": "马靖昊说会计_分类/财务指标解读/0298 自由现金流以及现金流量表分析的要点！！！.txt", "size": 8137, "excerpt": "自由现金流就是企业经营活动产生的、在满足了再投资需求之后剩余的现金流。自由现金流是企业可自由支配的现金流，有了自由现金流，企业才能把钱用于还本付息、为股东派发股利。 自由现金流为正的企业，说明具有良好的财务弹性，其持续经营能力强，能够源源不断地为股东带来现金产出；自由现金流为负的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "应付账款周转率！！！", "path": "马靖昊说会计_分类/财务指标解读/0300 应付账款周转率！！！.txt", "size": 6992, "excerpt": "应付账款周转率反映本企业免费占用供应商资金的能力，它代表公司的一种信用，一般来讲，该指标越慢越好。通过同行业比较，从应付账款周转率也能看出一个企业的行业地位，如公司应付账款周转率低于行业平均水平，说明公司较同行业其他企业，可以占用更多的供货商货款，表明其市场地位较高，但也不是绝对"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "营业收入！！！", "path": "马靖昊说会计_分类/财务指标解读/0301 营业收入！！！.txt", "size": 9645, "excerpt": "一家企业如果应收账款占总资产比重大，对企业的发展是极其不利的。应收账款就是客户拿了东西，钱还在客户手中。这样，虽然营业收入是算进来了，但是现金却没到自己手上。这些营业收入纯属白条收入，没有现金流入。 如果账面上只剩下可怜的一点货币资金，真不知道企业能否持续经营下去，这就是所谓的收"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "营业外收入！！！", "path": "马靖昊说会计_分类/财务指标解读/0302 营业外收入！！！.txt", "size": 8669, "excerpt": "大家肯定都听过“守株待兔”的寓言故事，说的是宋国有个农夫，他的田地中有一截树桩，一天，一只跑得飞快的野兔撞在树桩上，被扭断了脖子，死了，这位农夫捡到后，美餐了一顿。 这本来类似于“天上掉馅饼”的事情，属于一个很偶然的所得，即所谓会计上的“营业外收入”，但这位农夫最终却干脆什么活也"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "盈余公积！！！", "path": "马靖昊说会计_分类/财务指标解读/0307 盈余公积！！！.txt", "size": 8431, "excerpt": "点击下方卡片关注我 一、什么是盈余公积？ 盈余公积是指从净利润中提取的、具有特定用途的资金。公司制企业的盈余公积包括法定盈余公积和任意盈余公积。 1、法定盈余公积 根据《公司法》第一百六十六条，公司分配当年税后利润时，应当提取税后利润的10%列入公司法定公积金（非公司制企业也可按"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "权益乘数！！！", "path": "马靖昊说会计_分类/财务指标解读/0308 权益乘数！！！.txt", "size": 8466, "excerpt": "点击下方卡片关注我 权益乘数就是资产将所有者权益放大的倍数，为什么要放大，做企业那肯定要琢磨以小搏大的策略，比如投入一元，你想搏动四元的资产，权益乘数就是4。那么另外三元从哪里来呢？当然是借来的了，它的资产负债率为75%。通常我们将权益乘数的以小搏大现象称之为财务杠杆，权益乘数越"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "企业所得税九大预警指标是如何比对数据的？", "path": "马靖昊说会计_分类/财务指标解读/0309 企业所得税九大预警指标是如何比对数据的？.txt", "size": 6462, "excerpt": "点击下方卡片关注我 基础信息异常指标 两者信息上比对，一旦异常可能涉嫌偷税。 1、预警指标：企业基础信息与实际不符或其他相关表格数据不匹配。2、稽核比对的数据来源：（1）年度汇算基础信息表：《企业所得税年度纳税申报基础信息表》中基础经营情况、有关涉税事项情主要股东分红情况三部分信"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "存货周转率！！！", "path": "马靖昊说会计_分类/财务指标解读/0310 存货周转率！！！.txt", "size": 8571, "excerpt": "点击下方卡片关注我 存货周转率是反映企业营运能力重要指标之一，用来测定企业一定时期内存货的周转速度，存货周转率越高，表明企业存货资产变现能力越强，以及占用在存货上的资金周转速度越快。 用存货周转率来分析比较两家对标企业，如果A企业的存货周转率明显高于B企业，则反映A企业有更好的销"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "往来科目！！！", "path": "马靖昊说会计_分类/财务指标解读/0311 往来科目！！！.txt", "size": 7151, "excerpt": "点击下方卡片关注我 引言：往来科目，包括其他应收款、其他应付款、应收账款、应付账款、预收账款、预付账款、合同资产、合同负债。对于合同资产、合同负债的解说，大家可以阅读文章《合同资产与合同负债》。 东西已经卖出去了，钱还在别人的兜里，就是应收账款；东西买进来了，钱还在自已的手里，就"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "应付账款！！！", "path": "马靖昊说会计_分类/财务指标解读/0312 应付账款！！！.txt", "size": 8023, "excerpt": "点击下方卡片关注我 A公司的应付账款最近很烦躁，三天两头按到B公司应收账款的电话，这不趁早去紫竹院遛达散散心，真是怨家路窄，不期遇上了同样在此散心的B公司应收账款，难免又开始争执了。 应收账款说：“老兄，求你了，我已列入一年期账龄监管起来了。” 应付账款说：“兄弟，其实我想少还点"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "有位男同事，每次出差回来报销时，他都强烈要求现金报销，为什么？", "path": "马靖昊说会计_分类/财务指标解读/0313 有位男同事，每次出差回来报销时，他都强烈要求现金报销，为什么？.txt", "size": 5868, "excerpt": "点击下方卡片关注我 有位男同事，每次出差回来报销时，他都强烈要求现金报销，会计不解，细问之下，他才脸红地说：工资卡都上缴老婆了，这个要是再打到卡上，兜里就一个子都没了！哈哈哈，我们都乐疯了。。。可怜的人啊！ 一一fujing：我能说我也有这样的一位男同事吗，ps，我刚好是会计。 "}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "盈利能力！！！", "path": "马靖昊说会计_分类/财务指标解读/0315 盈利能力！！！.txt", "size": 9861, "excerpt": "点击下方卡片关注我 企业盈利能力的五大指标： 1.毛利率：毛利率＝（营业收入－营业成本）/营业收入（该指标主要反映公司产品在市场的竞争力）； 2.净利率：净利率＝净利润÷营业收入（毛利率是第一步的盈利能力评估，而净利率是第二步的盈利能力评估，净利率的高低直接受毛利率高低的影响，同"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "看一家企业好不好的最简洁方法", "path": "马靖昊说会计_分类/财务指标解读/0318 看一家企业好不好的最简洁方法.txt", "size": 6444, "excerpt": "点击下方卡片关注我 【看一家企业好不好的最简洁方法】1.看其主营业务收入占比，占比高的反映公司知道干什么。2.看其毛利润，毛利润高的，说明公司知道怎么干。3.看其三项费用，如果毛利润被三项费用\"拔毛\"后，其利润率比较高，说明公司管理到位。4.收入增长比和净利润增长比协调，且前者略"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "如何判断企业是不是在替银行打工？", "path": "马靖昊说会计_分类/财务指标解读/0320 如何判断企业是不是在替银行打工？.txt", "size": 7721, "excerpt": "点击下方卡片关注我 判断一家企业是不是在替银行打工，可看其财务费用的数额以及占净利润的比例，如果数额较大，且占净利润的比例超过50%以上，就基本可判断这家企业在为银行打工。如果已经持续了好几年，则又可判断该企业偿债能力出了问题，这些贷款是靠银行借新还旧一路走过来的。 这些都是我分"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "潜亏，潜伏在什么地方呢？", "path": "马靖昊说会计_分类/财务指标解读/0322 潜亏，潜伏在什么地方呢？.txt", "size": 9384, "excerpt": "点击下方卡片关注我 潜亏，就是潜伏着的亏损，本质上，是将费用潜伏起来，那么这些费用到底潜伏在什么地方呢？ 1.在账内潜伏，也就是那些披上资产外衣的费用，也称之为“资产水分”，它实际上是费用，但没有让它进利润表，而在资产方潜伏起来了，比如应收账款、其他应收款、存货、长期股权投资、在"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "自由现金流！！！", "path": "马靖昊说会计_分类/财务指标解读/0324 自由现金流！！！.txt", "size": 7478, "excerpt": "点击下方卡片关注我 不同的人对自由现金流有不同的理解。但万变不离其宗，自由现金流代表了企业每年拥有可以自由支配的现金有多少。换句话说，在企业支付必要的运营成本费用（比如购买存货、支付员工工资和偿付应付账款）以及资本性支出（比如建造厂房、购买机器设备）后所剩余的现金流就是自由现金流"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "有些企业的项目不赚钱甚至赔钱，为什么还要接？", "path": "马靖昊说会计_分类/财务指标解读/0329 有些企业的项目不赚钱甚至赔钱，为什么还要接？.txt", "size": 9182, "excerpt": "点击下方卡片关注我 有人问我，有些企业的项目不赚钱甚至赔钱，为什么还要接？从财务角度讲，不赚钱甚至赔点小钱，也是有利的，不然，企业养人的人力成本如何弥补？！不赚钱，那是针对老板而言的，但如果不接，人员工资都要靠老板垫付，那就赔得更惨。另外，从业务角度讲，至少介入了这个领域，熟悉了"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "存货！！！", "path": "马靖昊说会计_分类/财务指标解读/0333 存货！！！.txt", "size": 9088, "excerpt": "点击下方卡片关注我 公司的存货包括产品库存、生产原料库存等，存货过多会影响到公司下一报告期的生产和运营。上市公司产品库存多的可能性：1.产品销售遇到了困难，竞争力下降，产品跌价风险高。2.可能未计提或少计提了存货跌价准备。3.存货可能未及时结转为成本，以虚增利润；4.部分存货可能"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "应收账款周转率", "path": "马靖昊说会计_分类/财务指标解读/0334 应收账款周转率.txt", "size": 9011, "excerpt": "点击下方卡片关注我 应收账款周转率是用于衡量应收账款流动程度的指标，其取决于相对客户的强势或弱势地位、销售模式以及对应收账款的管理能力。应收账款周转率＝营业收入/应收账款平均余额。一般说来，企业应收账款比率越高，说明企业催收账款的速度越快，可以减少坏账损失，而且资产流动性强，企业"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "财务杠杆！！！", "path": "马靖昊说会计_分类/财务指标解读/0336 财务杠杆！！！.txt", "size": 7746, "excerpt": "点击下方卡片关注我 阿基米德曾经说过：“给我一个支点，我可以将整个地球撬起。”延伸到财务杠杆上，可以这样说：“只要借给我足够的钱，我就能够赚取更多的财富。”在财务管理中负债融资存在着这样的一种杠杆现象，它就是财务杠杆。具体地讲，财务杠杆是指在只有一部分自有资金的情况下，利用借到的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "销售净利率！！！", "path": "马靖昊说会计_分类/财务指标解读/0337 销售净利率！！！.txt", "size": 6771, "excerpt": "点击下方卡片关注我 公司销售净利率是指公司净利润占销售收入的百分比，其计算公式如下：销售净利率：销售净利率＝净利润÷销售收入。式中销售收入是指扣除销售折扣、销售折让和销售退回之后的销售净额。销售净利率与公司净利润成正比，与销售收入成反比。公司在提高销售收入的同时，必须更多地增加净"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "什么样的非财务信息可以用来判断企业陷入财务困境？", "path": "马靖昊说会计_分类/财务指标解读/0342 什么样的非财务信息可以用来判断企业陷入财务困境？.txt", "size": 6128, "excerpt": "点击下方卡片关注我 一 问题的引出 裁员是判断一个公司财务恶化的最直接信号。现在企业用工成本很高，当企业增长乏力，商业模式不清晰，未来走向不明朗时，自救的最佳方式就是采用N+1的补偿制度（N指工作年限，外加一个月工资）进行裁员。比如最近乐视现金流恶化，其自救的最直接有效方式就是大"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "任何忽视现金流而激进的企业，都是找死的节奏！", "path": "马靖昊说会计_分类/财务指标解读/0346 任何忽视现金流而激进的企业，都是找死的节奏！.txt", "size": 6875, "excerpt": "点击下方卡片关注我 任何忽视现金流而激进的企业，都是找死的节奏！这些企业一般都有先兆，到处投资热点项目、四处挖很\"贵\"的人，摊子越铺越大，而预期效益却迟迟未能来到。终于，财务危机被触发了，这时就全靠领军人物的融资能力了，能融来钱，吸取了教训，企业可能得到跨越式发展。反之，要是化缘"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "费用率", "path": "马靖昊说会计_分类/财务指标解读/0348 费用率.txt", "size": 7253, "excerpt": "点击下方卡片关注我 费用一般称为“三费”，包括销售费用、管理费用和财务费用，我们在计算企业费用率时，不能简单地认为费用率=（销售费用+管理费用+财务费用）÷营业收入，而是要单独考虑财务费用的正负情形。如果财务费用是正数（利息收支相抵后，是净支出），就把它和销售、管理费用加总一起除"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "几个重要的偿债能力指标！", "path": "马靖昊说会计_分类/财务指标解读/0349 几个重要的偿债能力指标！.txt", "size": 9504, "excerpt": "点击下方卡片关注我 【利息保障倍数】所谓利息保障倍数是指未扣除借款利息的利润总额能够多大程度覆盖借款利息，计算公式：息税前利润/利息支出，即(净利润+利息费用+所得税费用)/利息费用。 利息保障倍数至少应大于1，倍数越高，企业长期偿债能力越强。如果利息保障倍数过低，表明企业偿债的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "财眼看京东方的焦点", "path": "马靖昊说会计_分类/财务指标解读/0350 财眼看京东方的焦点.txt", "size": 6739, "excerpt": "点击下方卡片关注我 财眼看京东方的焦点一： 过山车式的周期属性2021年该公司实现历史最佳业绩，扣非归母净利润239.38亿元，同比增长 , "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "庞氏工资！！！", "path": "马靖昊说会计_分类/财务指标解读/0369 庞氏工资！！！.txt", "size": 3774, "excerpt": "点击下方卡片关注我 9月13日晚间，中金公司披露2022年拟采用配售股份方式，募集资金不超过人民币270亿元。连人均薪酬百万的中金公司都差钱，要募资，简直要惊掉下巴了。给高管开出天价工资，普通员工都是百万年薪，然后，没钱了就募资！这玩法，真厉害。我以前提出过庞氏分红、庞氏利息的概"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "现金流量表也可以打扮成“好看”的模样！", "path": "马靖昊说会计_分类/财务指标解读/0373 现金流量表也可以打扮成“好看”的模样！.txt", "size": 8524, "excerpt": "点击下方卡片关注我 大家阅读财报时，往往有一种错误的想法，就是资产负债表和利润表容易造假，而现金流量表不易造假。原因为现金流量表以现金收付制为基础编制的，不受权责发生制会计下的应计、递延、摊销和分配程序的影响，因此就简单地认为经营活动现金流量与权责发生制的利润相比，不容易被操纵，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "费用率=（销售费用+管理费用+财务费用）÷营业收入吗？", "path": "马靖昊说会计_分类/财务指标解读/0374 费用率=（销售费用+管理费用+财务费用）÷营业收入吗？.txt", "size": 5778, "excerpt": "点击下方卡片关注我 费用一般称为“三费”，包括销售费用、管理费用和财务费用，我们在计算企业费用率时，不能简单地认为费用率=（销售费用+管理费用+财务费用）÷营业收入，而是要单独考虑财务费用的正负情形。如果财务费用是正数（利息收支相抵后，是净支出），就把它和销售、管理费用加总一起除"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "永续债的记账反映了会计的魔术性！！！", "path": "马靖昊说会计_分类/财务指标解读/0377 永续债的记账反映了会计的魔术性！！！.txt", "size": 7506, "excerpt": "点击下方卡片关注我 什么叫永续债？永续债又称无期债券，是指可被发行人无限延期的债券。永续债发行人拥有赎回或延期的选择权，并在不触发强制付息条款的前提下拥有递延付息决定权。永续债持有人没有要求清偿本金的权利，但可以按期取得利息。理论而言，永续债发行人可以在每一个行权日将永续债不断延"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "一个价值投资最核心的指标ROIC", "path": "马靖昊说会计_分类/财务指标解读/0380 一个价值投资最核心的指标ROIC.txt", "size": 5498, "excerpt": "点击下方卡片关注我 全球最著名咨询公司麦肯锡给出了一个价值投资最核心的指标ROIC ，ROIC的全称是资本投入回报率（Return on Invested Capital），ROIC衡量的是股东和债权人投入的本钱，到底获取了多少回报，这是一个生意的本质。 资本投入回报率的计算方法"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "资产负债率能衡量企业的债务风险吗？！", "path": "马靖昊说会计_分类/财务指标解读/0382 资产负债率能衡量企业的债务风险吗？！.txt", "size": 7316, "excerpt": "点击下方卡片关注我 前二年，看到某企业的资产负债率超过80%了，比同行业平均水平还高了近20个点，表面看起来偿债能力较弱。不过，再细看资产负债表，负债项里预收账款（合同负债）高达6200万元，与1200万元的短期借款、600万元的应付账款、200万元的其他应付款相比，显得过于鹤立"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "应收账款！！！", "path": "马靖昊说会计_分类/财务指标解读/0384 应收账款！！！.txt", "size": 9015, "excerpt": "点击下方卡片关注我 应收账款就是客户拿了东西，钱还在客户手中。一家企业如果应收账款占总资产比重大，对企业的发展是极其不利的。这样，虽然营业收入是算进来了，但是现金却没到自己手上。这些营业收入纯属白条收入，没有现金流入。如果账面上只剩下可怜的一点货币资金，真不知道企业能否持续经营下"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "马靖昊：会计五行及其相生相克关系！", "path": "马靖昊说会计_分类/财务指标解读/0387 马靖昊：会计五行及其相生相克关系！.txt", "size": 6421, "excerpt": "点击下方卡片关注我 编者按：这是笔者在前些年在《财会信报》上发表的文章，把会计和五行能结合到一起，也是能通灵，再次证明，物物想通，大道至简！孔子五十岁学易经叹为观止，多处批注，悟出万物发展规律。要进一步将财务分析稼接在《易经》的64卦上，弄出个东邪西毒，九阳真经，葵花宝典...…"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "会计真的就这么简单​！", "path": "马靖昊说会计_分类/财务指标解读/0389 会计真的就这么简单​！.txt", "size": 21861, "excerpt": "点击下方卡片关注我 引言：下面的内容是本人今天下午在财政部某单位作的“穿越会计的迷雾”讲座的第一部分，讲座一共分为九个部分，用时整整3小时。现根据录音整理第一部分，分享给大家。我一直讲，这个世界上只有两种人：一种是懂会计的人，一种是不知道自己懂会计的人。要座的要是有人觉得自己不懂"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "毛利和毛利率！！！", "path": "马靖昊说会计_分类/财务指标解读/0390 毛利和毛利率！！！.txt", "size": 8501, "excerpt": "点击下方卡片关注我 什么是毛利，毛利是指销售收入减去成本（销售成本或主营业务成本）的差额，它是没有拔毛的利润，企业内部人拔的毛就是管理费用、销售费用，国企一般下手较狠；银行拔的毛就是财务费用；政府拔的毛就是主营业务税金及附加、所得税费用。拔干净了，就成净利润。有很多毛可以拔的一般"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "永续盘存制和实地盘存制，原来是这么回事！", "path": "马靖昊说会计_分类/财务指标解读/0392 永续盘存制和实地盘存制，原来是这么回事！.txt", "size": 5215, "excerpt": "点击下方卡片关注我 引言：有人问我什么叫永续盘存制，什么叫实地盘存制？永续盘存制就是如果你万一太忙，可以不定期去仓库中去看看货物的结余数是否与账上的数据一致，就是不去也不会影响做账；而实地盘存制，你至少在月末要去一下仓库盘点出商品的结余数，倒挤出减少的数量，才能将账做下去，这就是"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "马老师，您说为什么很多公司都烦财务，觉得财务部就会找麻烦？", "path": "马靖昊说会计_分类/财务指标解读/0396 马老师，您说为什么很多公司都烦财务，觉得财务部就会找麻烦？.txt", "size": 8612, "excerpt": "点击下方卡片关注我 Ms_Peipeiking：马老师，您说为什么很多公司都烦财务，觉得财务部就会找麻烦？我想先请大家一起说说！ lily_昭：因为财务要按照企业的规章制度办事，按照各种费用标准进行报销，而企业中总有一些人不肯按照制度，等费用发生了要去报销的时候，发现报不了。 T"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "商誉", "path": "马靖昊说会计_分类/财务指标解读/0398 商誉.txt", "size": 8402, "excerpt": "点击下方卡片关注我 什么是商誉呢？根据《企业会计准则第20号－企业合并》的规定，在非同一控制下的企业合并中，购买方对合并成本大于合并中取得的被购买方可辨认净资产公允价值份额的差额，应当确认为商誉。 绕来绕去，是不是有点复杂？ 其实，仅用6个字就可以解释清楚，商誉就是“买贵了的金额"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "又一位CFO出事，一审有期徒刑11年，并处罚金150万元", "path": "马靖昊说会计_分类/财务指标解读/0400 又一位CFO出事，一审有期徒刑11年，并处罚金150万元.txt", "size": 8369, "excerpt": "点击下方卡片关注我 11月21日，联创股份公告收到《刑事判决书》，事件涉及的是联创股份收购资产时被合同诈骗，标的公司业绩造假，相关参与人被给予了重罚，最严重的无期，其中一位财务总监兼董秘被判有期徒刑11年，并处罚金150万元。此次事件有五名被告人：1、孔刚，宽毅上海股权投资基金管"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "潜亏", "path": "马靖昊说会计_分类/财务指标解读/0407 潜亏.txt", "size": 9484, "excerpt": "点击下方卡片关注我 潜亏，就是潜伏着的亏损，本质上，是将费用潜伏起来，那么这些费用到底潜伏在什么地方呢？ 1.在账内潜伏，也就是那些披上资产外衣的费用，也称之为“资产水分”，它实际上是费用，但没有让它进利润表，而在资产方潜伏起来了，比如应收账款、其他应收款、存货、长期股权投资、在"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "其实疫苗公司、核酸检测公司的营收、盈利多半是应收账款", "path": "马靖昊说会计_分类/财务指标解读/0409 其实疫苗公司、核酸检测公司的营收、盈利多半是应收账款.txt", "size": 6733, "excerpt": "点击下方卡片关注我 目前“新冠检测”相关上市企业共有109家，这些企业2021年全年的净利润总和为740.98亿元，今年前三季度的净利润已经超过去年全年。有人说应对疫苗公司、核酸检测公司征收暴利税。其实，在我看来，这些企业的营收、盈利多半是应收账款，要是再征收所谓的“暴利税”，估"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "毛利率结合“销售难度率”，更便于分析产品的竞争力！", "path": "马靖昊说会计_分类/财务指标解读/0412 毛利率结合“销售难度率”，更便于分析产品的竞争力！.txt", "size": 6879, "excerpt": "点击下方卡片关注我 引言：为了更准确地分析企业产品的竞争力，我建议将销售费用率改称为“销售难度率”，采用“毛利率减去销售难度率”之值来进行分析，“毛利率-销售难度率”这个数值更能反映消费品的产品竞争力。 销售费用率是指公司的销售费用与营业收入的比率，销售费用率体现了企业为取得单位"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "其他综合收益！！！", "path": "马靖昊说会计_分类/财务指标解读/0415 其他综合收益！！！.txt", "size": 8089, "excerpt": "点击下方卡片关注我 由于公允价值的概念被运用了，才有其他综合收益。 “其他综合收益”指公司在持有资产的过程中因资产价格波动形成的账面收益，也就是它未在利润表中作为“利润”确认，而是在资产负债表中作为“所有者权益”确认。比如持有股票，如果打算长期持有，那价值波动就不影响当期损益，而"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "递延所得税！！！", "path": "马靖昊说会计_分类/财务指标解读/0417 递延所得税！！！.txt", "size": 7581, "excerpt": "点击下方卡片关注我 姜徽徽：马老师好，可否通俗的解说下递延所得税资产和递延所得税负债？马靖昊：好的！先不讲任何晦涩难懂的术语，这不是我马老师的风格，马老师就想将所有的财税东西说得谁都能懂。这样吧，先打一个比喻，所谓“递延所得税资产”和“递延所得税负债”好比“应交税费-应交所得税”"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "利息保障倍数", "path": "马靖昊说会计_分类/财务指标解读/0420 利息保障倍数.txt", "size": 5704, "excerpt": "点击下方卡片关注我 所谓利息保障倍数是指未扣除借款利息的利润总额能够多大程度覆盖借款利息，计算公式：息税前利润/利息支出，即(净利润+利息费用+所得税费用)/利息费用。利息保障倍数至少应大于1，倍数越高，企业长期偿债能力越强。如果利息保障倍数过低，表明企业偿债的安全性与稳定性有较"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "杜邦公式告诉CEO如何经营好一家企业", "path": "马靖昊说会计_分类/财务指标解读/0421 杜邦公式告诉CEO如何经营好一家企业.txt", "size": 6664, "excerpt": "点击下方卡片关注我 董事会对企业CEO的业绩评估一般以净资产收益率为主要指标，杜邦公式实际上就是对净资产收益率的分解：净资产收益率=(净利润/股东权益)=(净利润/总资产)×(总资产/股东权益)=(净利润/销售收入)×(销售收入/总资产)×(总资产/股东权益)=销售净利率×资产周"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "对于一家企业成长性的分析！！！", "path": "马靖昊说会计_分类/财务指标解读/0424 对于一家企业成长性的分析！！！.txt", "size": 5818, "excerpt": "点击下方卡片关注我 一家企业成长性分析的目的在于观察该企业在一定时期内的经营能力发展状况。一家企业即使收益很好，但如成长性不好，也不会很好地吸引投资者。对于一家企业成长性的分析，主要应分析其经营现金流增速、净利润增速、销售收入增速、净资产增速以及总资产增速等指标。一般而言，这些指"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "经营活动的现金流量！！！", "path": "马靖昊说会计_分类/财务指标解读/0425 经营活动的现金流量！！！.txt", "size": 10960, "excerpt": "点击下方卡片关注我 一家公司的经营活动产生的现金流量最重要！ 如果一家公司的经营活动产生的现金流量净额大于0，并在补偿当期的非付现成本后仍有剩余，这种情况说明公司通过正常的购、产、销活动所带来的现金流入量，在覆盖经营活动的现金流出量、补偿全部当期的非付现成本后，仍有余钱为公司的投"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "今天说说股票", "path": "马靖昊说会计_分类/财务指标解读/0430 今天说说股票.txt", "size": 8398, "excerpt": "点击下方卡片关注我 如果你炒股，我告诉你最好的方法就是耐心，这是一种“等待”的艺术。《股票作手回忆录》的作者杰西·利弗莫尔说，赚大钱的诀窍不在于买进卖出，而在于等待。当价格过高时，买入而期待有更傻的人来接棒，实际上，自己可能就是那个最后的接棒者。不过，惟一可以确定的是，人类还会一"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "总资产收益率！！！", "path": "马靖昊说会计_分类/财务指标解读/0433 总资产收益率！！！.txt", "size": 9801, "excerpt": "点击下方卡片关注我 根据总资产收益率ROA=净利润÷总资产=净利润÷（负债+所有者权益）；净资产收益率ROE=净利润÷所有者权益，当负债=0时，ROA=ROE。 这就说明，在企业管理中，一定要利用好负债，特别是无息负债，对于增加有息负债，也就是增加贷款，一方面会使收益增加，另一方"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务指标解读", "title": "主要是应收票据的原因！", "path": "马靖昊说会计_分类/财务指标解读/0445 主要是应收票据的原因！.txt", "size": 6229, "excerpt": "点击下方卡片关注我 一般来讲，销售商品提供劳务收到的现金应该大于营业收入，这是因为：收回的以前年度应收账款，以及预收的账款，还有可能是收回的其他应收款和多付的货款等。 销售商品、提供劳务收到的现金=利润表中主营业务收入×（1＋增值税税率%）＋利润表中其他业务收入 能就会利用存货难以盘点的特点，虚"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "如何发现存货造假的迹象！！！", "path": "马靖昊说会计_分类/财务造假识别/0056 如何发现存货造假的迹象！！！.txt", "size": 873, "excerpt": "： ， 。 视频 小程序 赞 ，轻点两下取消赞 在看 ，轻点两下取消在看 马靖昊说会计 说会计·谈财报·讲税收 [OCR_TIMEOUT] ☐ 增值税税负率与毛利率的关系 审计武功之精髓：审计黑白道！ 这里是拥有数百万高质量关注者的自媒体 做会计、搞企业、从事经济工作 不能不关注"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "谈谈财务上的“洗大澡”！！！", "path": "马靖昊说会计_分类/财务造假识别/0071 谈谈财务上的“洗大澡”！！！.txt", "size": 9620, "excerpt": "（一） 【财务上“洗大澡”的概念及案例】洗大澡”又称巨额冲销，就是高管人员利用公司重组、经营困难、自然灾害、会计制度和准则发生变化，或人员、股东、会计师事务所变更的契机，通过计提资产减值准备和确认或有损失等形式，对资产负债表进行“清洗”和“消毒”，从而释放风险、减轻负担, 为以后"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "“费用资本化”是一个公然进行财务造假的概念！！！", "path": "马靖昊说会计_分类/财务造假识别/0079 “费用资本化”是一个公然进行财务造假的概念！！！.txt", "size": 8219, "excerpt": "会计准则中的“费用资本化”是一个公然进行财务造假的概念，你把费用记作了“资产”，却不敢说“费用资产化”，搞了个“资本化”的概念是个什么东东？是想从文字上隐蔽它是一个对财务信息扭曲很大的造假方式吗？费用资本化显然是为美化“利润”准备的，本来要以费用去减少利润，却将费用记入到资产负债"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "上市公司虚增收入和利润的代价太大了！！！", "path": "马靖昊说会计_分类/财务造假识别/0080 上市公司虚增收入和利润的代价太大了！！！.txt", "size": 6951, "excerpt": "（一） 某些上市公司虚增收入和利润，为了不穿帮，真是不惜缴纳至少占收入2成以上的税收，税收本质上可不会让你真正采用权责发生制，必须及时缴纳真金白银。其实那怕造假的公司按时缴纳了这些税收，同时，将虚增收入而带来的资产“增加”也在资产负债表中作了“妥善”安排，但仍然有办法让它穿帮。 "}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "非常启发：如何从毛利率这个指标的变化去判断财务造假呢？", "path": "马靖昊说会计_分类/财务造假识别/0083 非常启发：如何从毛利率这个指标的变化去判断财务造假呢？.txt", "size": 6095, "excerpt": "毛利率是企业核心竞争力的财务反映，亦是IPO审核中重点关注的财务指标。除非经济环境发生重大改变，毛利率一般是比较稳定，不会大的波动，并且也很少会出现远远高于同行业的平均水平。 毛利率是毛利润除以销售收入的比率。什么是毛利润，毛利润是指销售收入减去成本（销售成本或主营业务成本）的差"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "上市公司财务造假的画像！！！", "path": "马靖昊说会计_分类/财务造假识别/0084 上市公司财务造假的画像！！！.txt", "size": 5686, "excerpt": "（一） 上市公司财务造假的画像：利用虚增收入和现金流入，如果账上的现金保持真实的话（一般企业都不太敢在“现金”项目上造假），它再通过虚增投资性现金流出达到现金流的平衡，让资产负债表和利润表同时膨胀；如果企业敢在“现金”项目上造假，那么它就省了通过投资性流出达到现金流的平衡这个造假"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "利润是否造假，其实要瞪大眼睛看资产！", "path": "马靖昊说会计_分类/财务造假识别/0085 利润是否造假，其实要瞪大眼睛看资产！.txt", "size": 9599, "excerpt": "真正懂财报的人都知道，资产负债表与利润表是高度关联的。比如某上市公司如果在利润表中记录了虚增的利润，必然要在资产负债表中通过虚增资产来消化这部分利润。 以前不少上市公司多半是通过虚增应收账款、存货、在建工程、固定资产等项目来消化虚增的利润，可能是虚增这些资产项目太累心了，因为都要"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "*ST宜生财务造假400余亿元，或触及多重退市风险", "path": "马靖昊说会计_分类/财务造假识别/0086 _ST宜生财务造假400余亿元，或触及多重退市风险.txt", "size": 8545, "excerpt": "（一） 【活生生的财务造假案例】巨额造假究竟打了谁的脸？虚构销售、伪造存款、存贷双高！*ST宜生财务造假400余亿元，或触及多重退市风险。1月28日，证监会通报了上市公司宜华生活相关调查情况，经初步查实，宜华生活于2016年至2019年定期报告存在严重虚假记载。 目前基本查实情况"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "上市公司各种财务造假的迹象汇总！！！", "path": "马靖昊说会计_分类/财务造假识别/0087 上市公司各种财务造假的迹象汇总！！！.txt", "size": 4123, "excerpt": "要识别上市公司财务造假，对于没什么财务知识背景的股民而言，可谓难上加难。下面是上市公司各种财务造假的迹象汇总： 1.财报没有被审计出具“标准无保留意见”；2.信息披露方面被证监会谴责；3.企业正在接受政府监管部门的调查；4.高管大量减持套现；5.企业高管频繁离职，特别是财务总监的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "资产负债表当中，最省事的财务造假项目是什么？", "path": "马靖昊说会计_分类/财务造假识别/0088 资产负债表当中，最省事的财务造假项目是什么？.txt", "size": 8424, "excerpt": "（一） 问大家一个问题：资产负债表当中，最省事的财务造假项目是什么？ 要我来回答，一定是货币资金了。虚增应收账款、存货，这些属于流动资产，让你看不见、摸不着，今天在明天就可能不在，虚虚实实，但大家别忘了，应收账款有坏账，存货要减值，还有一个更不利的，“三流合一”是虚增流动资产死敌"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "预付账款中可能隐藏的猫腻！！！", "path": "马靖昊说会计_分类/财务造假识别/0099 预付账款中可能隐藏的猫腻！！！.txt", "size": 6110, "excerpt": "引言：预付账款是企业因购货和接受劳务，按照合同规定预付给供应单位的款项，包括预付货款和预付工程款。在公司的日常核算中，预付账款是一项流动资产。通俗来讲，我们也可以认为预付账款是先将钱放在供应商的手上，不过，供应商还没有给你产品或者为你提供服务。（一）上市公司如何通过预付账款造假？"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "马老师，您能用通俗的话讲下财务造假与盈余管理吗？", "path": "马靖昊说会计_分类/财务造假识别/0105 马老师，您能用通俗的话讲下财务造假与盈余管理吗？.txt", "size": 6715, "excerpt": "引言： ---空军一号---：马老师 您能用通俗的话讲下财务造假与盈余管理吗？ 马靖昊：“---空军一号---”同志，你飞得高，应该看得很远吧，如果你能够在利润上也看得很远，就懂财务造假与盈余管理了。比如，你能够看清楚近5年利润的大致情况，就可以在5个会计期间将利润推前、推后，作"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "分析资产负债表科目的异常，更容易发现财务造假的线索", "path": "马靖昊说会计_分类/财务造假识别/0112 分析资产负债表科目的异常，更容易发现财务造假的线索.txt", "size": 6707, "excerpt": "（一） 财务造假是围绕\"资产+费用＝负债+所有者权益+收入\"这个动态会计平衡等式进行的，上市公司财务造假主要是虚增利润，表达为：资产↑+费用↓＝负债↓+所有者权益+收入↑，而虚增利润必然会影响到资产负债表科目。因此，在利润存疑的情况下，通过分析资产负债表科目的异常，往往更容易发现"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "上市公司为虚构收入而套取资金的方法  ​", "path": "马靖昊说会计_分类/财务造假识别/0117 上市公司为虚构收入而套取资金的方法  ​.txt", "size": 5868, "excerpt": "（一） 有一种财务造假是假戏真做，上市公司为虚构收入而套取资金以实现货款回笼，它可能采用的方法有： 1.通过虚假预付款项（预付商品采购款、预付工程设备款等）套取资金用于虚增收入的货款回笼。 2.虚增长期资产采购金额。上市公司通过虚增对外投资、固定资产、在建工程、无形资产、开发支出"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "中信国安财务造假的要点！！！", "path": "马靖昊说会计_分类/财务造假识别/0119 中信国安财务造假的要点！！！.txt", "size": 10100, "excerpt": "（一） 中信国安财务造假的要点： 1.2009年4月，青海中信国安召开销售专题会议，制定了10亿元的销售目标。 －－好高骛远，脱离实际，在预计当年销售收入约为4亿元的情况下，却制定了10亿元销售目标，为的是那般？ 2.青海中信国安在2009年－2014年期间，累计虚增营收5.06"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "权责发生制的罪！！！", "path": "马靖昊说会计_分类/财务造假识别/0123 权责发生制的罪！！！.txt", "size": 7481, "excerpt": "权责发生制是企业财务造假的根源！ 除去极少数在货币资金上都敢于造假的上市公司外，一般而言，报表上除货币资金外，都没有唯一正确的数字，在权责发生制会计下，100个会计师独立编制同一家企业的利润表，会可能得到101个结果。 原因就是会计上采用权责发生制原则来核算利润，即以取得现金收入"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "贾跃亭指挥乐视网十年财务造假，手段极其恶劣，金额极其巨大！", "path": "马靖昊说会计_分类/财务造假识别/0124 贾跃亭指挥乐视网十年财务造假，手段极其恶劣，金额极其巨大！.txt", "size": 8919, "excerpt": "（一） 【贾跃亭指挥乐视网十年财务造假，手段极其恶劣，金额极其巨大】经证监会调查，乐视网于2007年至2016年财务造假，其报送、披露的申请首次公开发行股票并上市(简称IPO)相关文件及2010年至2016年年报存在虚假记载。 具体来看，乐视网2007年虚增收入939.95万元，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "计提资产减值准备为虚增资产开了方便之门", "path": "马靖昊说会计_分类/财务造假识别/0130 计提资产减值准备为虚增资产开了方便之门.txt", "size": 6234, "excerpt": "（一） 计提资产减值准备为虚增资产开了方便之门，比如有一家上市公司，从账上分析，它的存货周转率下降明显，说明存货的流动性越来越差。后来，它将其存货几乎都计提减值了！难道这些存货突然间就变得不值钱了，真是怪事！ 看来，这些账上的存货在现实中到底存在还是不存在是一个大问题，想通过存货"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "中文传媒存在财务造假问题吗？", "path": "马靖昊说会计_分类/财务造假识别/0135 中文传媒存在财务造假问题吗？.txt", "size": 8797, "excerpt": "今天（5月6日）该公司市值147.3亿元，2020年净利润18亿元，净资产152亿元，扣除商誉后净资产128亿元（假设商誉全部计提减值），静 避免损失，不可能去砸盘。 财务造假揭穿者，手里"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "“体外循环”的财务造假方法！", "path": "马靖昊说会计_分类/财务造假识别/0162 “体外循环”的财务造假方法！.txt", "size": 7841, "excerpt": "（一） 【介绍：“体外循环”的财务造假方法】农业类免税的公司最适合采用体外循环的财务造假方法，因为税务成本几乎为0。 体外循环的大概流程如下：虚增存货－通过在建工程和工程公司把资金转到体外－再把钱通过体外的主体购买自己虚增的存货－从而消除虚增的存货，形成收入、利润－留下的是虚增的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "虚增资产！！！", "path": "马靖昊说会计_分类/财务造假识别/0172 虚增资产！！！.txt", "size": 9887, "excerpt": "（一） 如果虚增了利润（利润表），就无法产生真实的现金流（现金流流量表），造假者就必须通过虚增资产（资产负债表）来圆谎。 打个比喻，你谎称自己有100万的年收入，别人要你拿出证明来，你怎么办？你肯定拿不出100万的现金，这时，你可能借别人的豪宅或豪车用一下，以证明自己配得上百万年"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "证监会通报首批适用新《证券法》财务造假案件，最高拟处以近4,000万元罚款", "path": "马靖昊说会计_分类/财务造假识别/0175 证监会通报首批适用新《证券法》财务造假案件，最高拟处以近4,000万元罚款.txt", "size": 5341, "excerpt": "上市公司财务造假是证券市场的“毒瘤”，严重破坏市场运行基础，侵害投资者利益，始终是证监会监管执法重点。近年来，证监会持续加大对财务造假、操纵市场等恶性违法案件的查处力度，坚决落实新《证券法》各项要求，切实提升资本市场违法违规成本，强化监管执法震慑。近日，首批适用新《证券法》惩处财"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "毒眼看企业的竞争力！！！", "path": "马靖昊说会计_分类/财务造假识别/0181 毒眼看企业的竞争力！！！.txt", "size": 5833, "excerpt": "（一） 通过分析毛利率指标，可以了解一家公司的产品竞争力及风险。高毛利率说明公司的产品或服务有很强的竞争力，相应，低毛利率则说明公司的产品或服务竞争力较差。一般来说，毛利率大于 40%的公司都有某种核心竞争力。 优秀公司的毛利率不但高还比较稳定，波动幅度比较小。一般来说优秀公司的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "胆大包天：竟然直接修改经审计后的合并会计报表的方式虚增利润6.11亿元！", "path": "马靖昊说会计_分类/财务造假识别/0190 胆大包天：竟然直接修改经审计后的合并会计报表的方式虚增利润6.11亿元！.txt", "size": 7334, "excerpt": "（一） 【胆大包天：胜通集团通过直接修改经审计后的合并会计报表的方式虚增利润6.11亿元】胜通集团在审计机构中天运会计师事务所出具2016年度、2017年度的审计报告后，直接修改经审计后的胜通集团合并会计报表，在修改后的财务报表上加盖虚假的中天运印章后将报表对外披露。通过该方式，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "会计差错绝不是财务造假的挡箭牌！", "path": "马靖昊说会计_分类/财务造假识别/0191 会计差错绝不是财务造假的挡箭牌！.txt", "size": 5711, "excerpt": "一 【獐子岛的造假利润藏在哪里？】獐子岛将造假利润藏到了海产品的存货中，也就是将本该计入利润表的成本金额，计入了资产负债表的存货中。当需要清空这些假存货时，只要发一个公告，扇贝又跑了，存货瞬间灰飞烟灭。相应，虚增的利润通过存货减值（非常损失），完成闭环实现账目平衡，并且可以归为天"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat":  首例丨上市公司重大重组财务造假判无期徒刑、没收个人全部财产.txt", "size": 9752, "excerpt": "财务造假，被判无期徒刑、没收个人全部财产，退还19亿！ 罚的倾家荡产！强监管风暴来袭！ 财顾、律师、会计师、评估师伙伴们，以后做业务都要小心了，现在监管处罚真的严了，不值得。 根据上市公司即被害人南京康尼机电股份有限公司公告，2020年11月12日，南京中院出具《刑事判决书》，一"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "又创造一个财务造假的新概念！", "path": "马靖昊说会计_分类/财务造假识别/0206 又创造一个财务造假的新概念！.txt", "size": 7890, "excerpt": "会计准则中的“费用资本化”是一个公然进行财务造假的概念，你把费用记作了“资产”，却不敢说“费用资产化”，搞了个“资本化”的概念是个什么东东？是想从文字上隐蔽它是一个对财务信息扭曲很大的造假方式吗？费用资本化显然是为美化“利润”准备的，本来要以费用去减少利润，却将费用记入到资产负债"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "会计相面术", "path": "马靖昊说会计_分类/财务造假识别/0207 会计相面术.txt", "size": 6758, "excerpt": "一 【会计相面术】通过资产数额看企业的规模以及是否匀称；通过负债数额看企业的有息负债、无息负债规模；通过股权结构看老板的胸怀；通过收入看企业的成长；通过管理费用看企业的管理水平；通过销售费用看企业的销售难度；通过财务费用看企业负债的代价；通过薪酬看企业职工待遇；通过利润看企业效益"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "利用毛利率相关的异常情况去判断财务造假，简单粗暴，但却十分有效！", "path": "马靖昊说会计_分类/财务造假识别/0212 利用毛利率相关的异常情况去判断财务造假，简单粗暴，但却十分有效！.txt", "size": 6074, "excerpt": "毛利率是毛利润除以销售收入的比率。什么是毛利润，毛利润是指销售收入减去成本（销售成本或主营业务成本）的差额，它是没有拔毛的利润，毛利润出来后，企业先拔一层毛，也就是将期间费用、损失、减值等抵销掉，这样，就拔出了利润总额了，这时，政府再拔点所得税，拔干净了，就成净利润。 分析上市公"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "面对上市公司各种财务造假行为，不懂财报的散户该如何排雷呢？", "path": "马靖昊说会计_分类/财务造假识别/0218 面对上市公司各种财务造假行为，不懂财报的散户该如何排雷呢？.txt", "size": 5300, "excerpt": "要识别上市公司各种财务造假行为，对于没什么财务知识背景的股民而言，可谓难上加难。那么，不懂财报的散户该如何排雷呢？下面就是给大家参考的排雷经验汇总： 1.财报没有被审计出具“标准无保留意见”（出具“保留意见、否定意见、无法表示意见”，意味着这家公司财务风险度高。）； 2.信息披露"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "其他应收款！！！", "path": "马靖昊说会计_分类/财务造假识别/0219 其他应收款！！！.txt", "size": 5662, "excerpt": "（一） 会计上有一个科目距离我们最近，它与你我他有关，很有可能，你由于它而记入凭证，登入明细账薄，它的名字叫“其他应收款”。比如你由于失职而向单位支付的赔款、罚款，单位给你周转用的备用金，单位给你垫付的各种款项，你向单位借用的款项等，这些都有可能让你载入账册。LyraLee沐维恩"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "财务造假虚增利润1.75亿被罚60万！退回多缴所得税1500万！", "path": "马靖昊说会计_分类/财务造假识别/0223 财务造假虚增利润1.75亿被罚60万！退回多缴所得税1500万！.txt", "size": 1540, "excerpt": "： ， 。 视频 小程序 赞 ，轻 方式吗？费用资本化显然是为美化“利润”准备的，本来要以费用去减少利润，却"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "体外循环！！！", "path": "马靖昊说会计_分类/财务造假识别/0361 体外循环！！！.txt", "size": 7142, "excerpt": "点击下方卡片关注我 【介绍：“体外循环”的财务造假方法】体外循环的大概流程如下：虚增存货－通过在建工程和工程公司把资金转到体外－再把钱通过体外的主体购买自己虚增的存货－从而消除虚增的存货，形成收入、利润－留下的是虚增的固定资产－固定资产在未来一二十年里慢慢折旧消化为零。 采用这种"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "财务危机！！！", "path": "马靖昊说会计_分类/财务造假识别/0362 财务危机！！！.txt", "size": 6213, "excerpt": "点击下方卡片关注我 什么是财务危机？用两个字概括就是“没钱”。一般来说，一家公司发生财务危机表现为以下几种情况： 第一位：现金不足以购买原材料和发工资了；第二位：过多的应收账款没有收回来；第三位：过多的存货没有卖出去；第四位：公司买了过多的房子和土地，占用了大量资金；第五位：大股"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "如何从毛利率的变化去判断财务造假？", "path": "马靖昊说会计_分类/财务造假识别/0363 如何从毛利率的变化去判断财务造假？.txt", "size": 7331, "excerpt": "点击下方卡片关注我 判断一家上市公司的财报造没造假，分析其毛利率的真实性非常重要。毛利率是企业核心竞争力的财务反映，亦是IPO审核中重点关注的财务指标。除非经济环境发生重大改变，毛利率一般是比较稳定，不会大的波动，并且也很少会出现远远高于同行业的平均水平。先说结论：我们从常识出发"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "高分红可以治理财务造假 ？！", "path": "马靖昊说会计_分类/财务造假识别/0366 高分红可以治理财务造假 ？！.txt", "size": 5254, "excerpt": "点击下方卡片关注我 有位朋友说，高分红可以治理财务造假，为此建议采用强制分红分级制度：1.市值万亿及以上的，分红不低于当年盈利的80%；2.市值5000亿及以上的，分红不低于当年盈利的60%；3.市值1000亿及以上的，分红不低于当年盈利的50%；4.市值500亿及以上的，分红不"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "财务舞弊易发高发领域及重点应对措施", "path": "马靖昊说会计_分类/财务造假识别/0376 财务舞弊易发高发领域及重点应对措施.txt", "size": 20903, "excerpt": "点击下方卡片关注我 引言：财政部最近发布了《关于加大审计重点领域关注力度 控制审计风险 进一步有效识别财务舞弊的通知》（财会〔2022〕28号），指导会计师事务所和注册会计师提高应对财务舞弊的执业能力，充分发挥审计鉴证作用。 《通知》中要求：注册会计师要严格执行审计准则，在整个审"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "利润是否造假，关键看资产负债表！", "path": "马靖昊说会计_分类/财务造假识别/0383 利润是否造假，关键看资产负债表！.txt", "size": 10552, "excerpt": "点击下方卡片关注我 真正懂财报的人都知道，资产负债表与利润表是高度关联的。比如某上市公司如果在利润表中记录了虚增的利润，必然要在资产负债表中通过虚增资产来消化这部分利润。 以前不少上市公司多半是通过虚增应收账款、存货、在建工程、固定资产等项目来消化虚增的利润，可能是虚增这些资产项"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "企业的竞争力！！！", "path": "马靖昊说会计_分类/财务造假识别/0385 企业的竞争力！！！.txt", "size": 9439, "excerpt": "点击下方卡片关注我 企业的竞争力主要体现在两个方面：第一，体现在优秀的、高质量的利润表现上，具体表现为比同行企业更能赚钱，是同行中的“印钞机”；第二，体现在对产业链上下游资金的占用上，具体表现为拥有大量的应付账款、预收账款（对应占用上游的资金一般体现为应付账款，对应占用下游的资金"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "会计准则在某种程度上已经成为企业操纵利润的抓手", "path": "马靖昊说会计_分类/财务造假识别/0386 会计准则在某种程度上已经成为企业操纵利润的抓手.txt", "size": 9480, "excerpt": "点击下方卡片关注我 资产减值会计准则体现了“谨慎性”的会计信息质量要求，具体表现为应收账款坏账准备，存货跌价准备，固定资产、在建工程和无形资产的减值准备等。 起初，资产减值会计准则旨在挤出企业财务数字中的水分，从而防止资产泡沫的出现和膨胀，但如今，这些会计准则在某种程度上已经成为"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "马老师，您能用通俗的话讲下财务造假与盈余管理吗？", "path": "马靖昊说会计_分类/财务造假识别/0393 马老师，您能用通俗的话讲下财务造假与盈余管理吗？.txt", "size": 6791, "excerpt": "点击下方卡片关注我 引言： ---空军一号---：马老师 您能用通俗的话讲下财务造假与盈余管理吗？马靖昊：“---空军一号---”同志，你飞得高，应该看得很远吧，如果你能够在利润上也看得很远，就懂财务造假与盈余管理了。比如，你能够看清楚近5年利润的大致情况，就可以在5个会计期间将"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "逆天了，由报表间内在关系发现财报造假的惊心秘密！", "path": "马靖昊说会计_分类/财务造假识别/0394 逆天了，由报表间内在关系发现财报造假的惊心秘密！.txt", "size": 11472, "excerpt": "点击下方卡片关注我 财务报表中主表就一张，即资产负债表，利润表、现金流量表都是资产负债表的附表。为什么说资产负债表是财务报告中唯一的主表呢？因为第一，要是没有利润表，可以通过对资产负债表中的净资产期末数与期初数进行比较，计算出当年的利润数额；第二，要是没有现金流量表，可以通过对货"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "马老师，您好！对上市公司的预付款项能做出什么样的判断？会成为造假行为么？", "path": "马靖昊说会计_分类/财务造假识别/0395 马老师，您好！对上市公司的预付款项能做出什么样的判断？会成为造假行为么？.txt", "size": 9428, "excerpt": "点击下方卡片关注我 有一位网名叫happysen79的朋友在微博回答中提问：马老师，您好！对上市公司的预付款项能做出什么样的判断？会成为造假行为么？谢谢！ 您好，现在就您的问题答复如下： 预付款项是支付给供应商的款项，包括预付货款和预付工程款等，是公司在收到供应商的产品或服务之前"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "*ST紫晶欺诈发行解读：“体外担保术”造假！", "path": "马靖昊说会计_分类/财务造假识别/0401 _ST紫晶欺诈发行解读：“体外担保术”造假！.txt", "size": 7093, "excerpt": "点击下方卡片关注我 昔日的“光存储第一股”紫晶存储(*ST紫晶，688086.SH)涉嫌IPO造假，或遭科创板强制退市。11月19日，*ST紫晶公告称，收到证监会《行政处罚及市场禁入事先告知书》，公司涉嫌欺诈发行、信息披露违法违规，被责令改正，给予警告，并处以3668.52万元罚"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财务造假识别", "title": "虚增资产！！！", "path": "马靖昊说会计_分类/财务造假识别/0403 虚增资产！！！.txt", "size": 9367, "excerpt": "点击下方卡片关注我 如果通过横 不太可信的参考数字吧。因为财务人员不同，算法会不同，结果会不一样。正因为它是计算出来的，人为或虚假的因素"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "报表的勾稽关系！！！", "path": "马靖昊说会计_分类/财报分析方法/0093 报表的勾稽关系！！！.txt", "size": 8668, "excerpt": "（一） 财务报表体系及其勾稽关系。 企业所有的现金支出都会直接在现金流量表中记录，但相对于资产负债表和利润表要区分为“对未来有用”的支出和“当下有关”支出，“对未来有用”的支出，会作为资产记录在资产负债表中；只与“当下有关”的支出，会作为费用记录在利润表中。这样记录的结果必须造成"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "请马老师讲讲合同资产、合同负债是什么东西，谢谢！", "path": "马靖昊说会计_分类/财报分析方法/0100 请马老师讲讲合同资产、合同负债是什么东西，谢谢！.txt", "size": 12933, "excerpt": "阿熊1991：请马老师讲讲合同资产、合同负债是什么东西，谢谢！ 马靖昊：好的，我来告诉你，它们是什么东西！ 一 合同资产是什么东西？ 合同资产是在新收入准则下对应收账款科目作出的进一步增补，根据《企业会计准则第14号——收入》，合同资产，是指企业已向客户转让商品而有权收取对价的权"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "分析财务报表的核心点！！！", "path": "马靖昊说会计_分类/财报分析方法/0108 分析财务报表的核心点！！！.txt", "size": 6385, "excerpt": "资产创造收益，看资产负债表关键是看资产质量；收益形成盈利，看利润表关键是看盈利质量；盈利形成现金，看现金流量表关键是看现金流数量。 分析财务报表的核心点： 1.利润表－分析盈利质量，也就是分析利润中到底有多少现金，如果现金低于30%以下，盈利质量是很差的，甚至根本就不是什么盈利，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "有息负债 VS 无息负债", "path": "马靖昊说会计_分类/财报分析方法/0115 有息负债 VS 无息负债.txt", "size": 6841, "excerpt": "（一） 负债可以分为两类，无息负债和有息负债。无息负债一般是指来自经销商先付款后提货形成的预收账款，以及向供货商延期支付形成的应付票据和应付账款，说通俗点，无息负债就是通过欠产业链上下游的钱，做自己的生意。有息负债，包括银行长期借款、发行债券等，它的特点就是负债越多需支付的资金费"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "中兴通讯2020年度扣非净利润成倍增长，背后暗藏玄机！", "path": "马靖昊说会计_分类/财报分析方法/0121 中兴通讯2020年度扣非净利润成倍增长，背后暗藏玄机！.txt", "size": 8302, "excerpt": "2021年3月17日，中兴通讯发布业绩预告，一季度归属净利润同比增长130.77%至207.70%，利润暴增。在美国制裁中兴事件距今两年之际，中兴通讯的经营是否全面恢复？让我们通过财务报表一窥究竟。一、2020年度扣非净利润成倍增长，背后暗藏玄机2020年度，该公司扣非净利润10"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "为什么「深南电路」财报数据看起来不错，但股价却已近腰斩？", "path": "马靖昊说会计_分类/财报分析方法/0132 为什么「深南电路」财报数据看起来不错，但股价却已近腰斩？.txt", "size": 7012, "excerpt": "2020年度，该公司营业收入同比增长10.23%，归属净利润同比增长16.01%，看起来不错，但该公司的股价却已近腰斩，为何？ 一、季度收入增速和毛利率同时下降，提示下游需求降低，行业趋冷 虽然该公司的年度业绩表现尚可，但是从单个季度看，下半年经营情况明显不如上半年，特别是第四个"}, {"lib": "majinghao", "libname": "马靖
