 航天电器的财报分析要点.txt", "size": 7608, "excerpt": "从历史看，成长能力突出。2012年至今的8年时间里，该公司营业收入复合增速18%，增速水平较高，体现出较强的成长能力。同行业中航光电近8年收入增速为21%，增速也较高。可见，航天电器出众的成长能力或许是受益于行业整体的快速发展。航天电器历年净资产收益率均超10%，且自2012年以"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "报表视角下的恋爱三个阶段", "path": "马靖昊说会计_分类/财报分析方法/0171 报表视角下的恋爱三个阶段.txt", "size": 8778, "excerpt": "（一） 从报表的视角，谈恋爱的三个阶段可理解为：现金流量表阶段，爱她就愿意为她买买买；利润表阶段，居家过日子总不能月光，总得算计收入、利润几何啊；资产负债表阶段，有无车子、房子，全款还是按揭？资产负债表获得了审计通过，就到了该领证的时候了！ 丢了大号的憨憨：绝了！ ohyespl"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "固定资产！！！", "path": "马靖昊说会计_分类/财报分析方法/0174 固定资产！！！.txt", "size": 7542, "excerpt": "一 有一位仁兄听会计说公司的汽车是固定资产，反问道，汽车可会跑动啊，怎么说是固定资产。请你也先不要笑，到底谁对谁错，还不知道呢？ 再给大家一个例子，刚才在外面看到一幢新盖的房子，我突然想到在财务上可以用多达四个科目记载它。如是自建自用的，完工后可记为“固定资产”，如还未结转，则先"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "你要是不清楚负债分为有息负债、无息负债，基本上就不懂企业的财务风险！", "path": "马靖昊说会计_分类/财报分析方法/0176 你要是不清楚负债分为有息负债、无息负债，基本上就不懂企业的财务风险！.txt", "size": 6354, "excerpt": "（一）负债可以分为两类，无息负债和有息负债。无息负债一般是指来自经销商先付款后提货形成的预收账款，以及向供货商延期支付形成的应付票据和应付账款，说通俗点，无息负债就是通过欠产业链上下游的钱，做自己的生意。有息负债，包括银行长期借款、发行债券等，它的特点就是负债越多需支付的资金费用"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "分析财报的最高境界应是欣赏数字之间的暧昧眼神", "path": "马靖昊说会计_分类/财报分析方法/0178 分析财报的最高境界应是欣赏数字之间的暧昧眼神.txt", "size": 7898, "excerpt": "（一） 有些人看财报如同捉奸，例如夏草、老郎等人，其实大可不必。财报只是根据会计准则的游戏规则编制而成的，我们大可欣赏其数字间的暧昧眼神，捉奸就有点过于急进了，毕竟人家要玩也是在很隐蔽的地方，况且你也不是警察，无权破门而入，没法取证。因此，分析财报的最高境界应是欣赏数字之间的暧昧"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "马靖昊：会计五行及其相生相克关系！", "path": "马靖昊说会计_分类/财报分析方法/0179 马靖昊：会计五行及其相生相克关系！.txt", "size": 5971, "excerpt": "编者按：这是笔者在2016年八月份在《财会信报》上发表的文章，把会计和五行能结合到一起，也是能通灵，再次证明，物物想通，大道至简！ 孔子五十岁学易经叹为观止，多处批注，悟出万物发展规律。马靖昊未来准备将财务分析稼接在《易经》的64卦上，弄出个东邪西毒，九阳真经，葵花宝典...… "}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "利润！！！", "path": "马靖昊说会计_分类/财报分析方法/0182 利润！！！.txt", "size": 9461, "excerpt": "▲向上滑动查看 *广告 鸸鹋鸟一生高速奔跑， 为什么它膝盖不怕磨损！！ 有一种“油”叫做“鸸鹋油”，提取自一种外形神似鸵鸟的“澳洲国鸟”——鸸鹋鸟身上。 鸸鹋高速奔跑不损伤，还能在寒带生存，秘诀在于其骨骼周围有层油脂包裹。产品使用进口澳洲鸸鹋油创新将其作用于人体肩颈、膝盖，研制鸸"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "表上有利润，账上没有钱，借钱去交税，大家如何看？", "path": "马靖昊说会计_分类/财报分析方法/0186 表上有利润，账上没有钱，借钱去交税，大家如何看？.txt", "size": 6726, "excerpt": "有一位朋友的企业，表上有利润，但是现金流差，每次要纳税时，钱都不够，于是，借钱去交税。遇到过同样情况的朋友，请分享接龙。 引 子 从上面可以充分说明利润与钱还是差别特别大，有利润不一定有钱，没利润不一定没钱。 一 16号老王：开个公司就像开出租一样，份子钱压力大啊！ 马靖昊说会计"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "上市公司做大利润的基本逻辑", "path": "马靖昊说会计_分类/财报分析方法/0200 上市公司做大利润的基本逻辑.txt", "size": 9140, "excerpt": "上市公司做大利润的基本逻辑：根据“资产=负债+所有者权益，利润=收入-成本和费用”会计动态平衡式，做大利润无非就是虚增收入或少计费用，且为了使资产负债表和利润表平衡，增加的利润要有增加的资产或者减少的负债相对应。不过，其中负债很难去造假（大家知道为什么吗？欢迎留言讨论）。此外，一"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "资产的异常增长！！！", "path": "马靖昊说会计_分类/财报分析方法/0210 资产的异常增长！！！.txt", "size": 6413, "excerpt": "（一） 在发生过的上市公司财务造假案例中，但凡涉及巨额虚增利润的公司都无一例外地伴随着总资产的大幅增长。比如乐视网总资产从2010年起到总资产达到峰值时的2016年底，总资产年复合增长率为78％。虚增资产和利润的最终目的是圈进更多的钱。总资产的异常增长不是虚增利润的充分条件，但一"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "有息负债与无息负债！！！", "path": "马靖昊说会计_分类/财报分析方法/0211 有息负债与无息负债！！！.txt", "size": 7173, "excerpt": "（一）负债可以分为两类，无息负债和有息负债。无息负债一般是指来自经销商先付款后提货形成的预收账款，以及向供货商延期支付形成的应付票据和应付账款，说通俗点，无息负债就是通过欠产业链上下游的钱，做自己的生意。有息负债，包括银行长期借款、发行债券等，它的特点就是负债越多需支付的资金费用"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "核心利润！！！", "path": "马靖昊说会计_分类/财报分析方法/0213 核心利润！！！.txt", "size": 5352, "excerpt": "（一） 【什么是核心利润？】核心利润强调一个公司正常经营、正常核算下所产生的正常利润。在间接法下，核心利润需要以净利润为起点，对非主营业务产生的利润进行扣除，对过于激进的会计方法下产生的利润进行扣除，对非经常性的利得或损失进行扣除。在直接法下，核心利润的计算公式为：核心利润=营业"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "你觉得，最会计的一句话是什么？", "path": "马靖昊说会计_分类/财报分析方法/0216 你觉得，最会计的一句话是什么？.txt", "size": 4385, "excerpt": "我发了一条内容为“你觉得，最会计的一句话是什么？”的微博，没想到会计人员回答很踊跃，收到300多条回答，很多都很有意思，现摘录如下： 跛棱盖嘎嘣嘎嘣响：尽量要专票回来 不要普票。 一只晕头晕脑的土拨鼠：把发票贴好了再来核！ 阿罗酱GO：念念不忘 必有坏账。 Y楊顏：谁拿了我的笔！"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "原来徐志摩也是会计，信不信由你！", "path": "马靖昊说会计_分类/财报分析方法/0233 原来徐志摩也是会计，信不信由你！.txt", "size": 12682, "excerpt": "一 原来徐志摩也是会计，信不信由你：现给大家录一首徐志摩写给林徽因的诗《偶然》。此诗是林徽因不辞而别后……徐志摩专门为她写的： 点此打开 《偶然》 我借天空里的一片云恰好贷在你的波心你不必讶异更无须欢喜在转瞬间消失在账簿中你我相逢在报表里你有你的业务我有我的语言方向你记得也好最好"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "可持续的利润！！！", "path": "马靖昊说会计_分类/财报分析方法/0234 可持续的利润！！！.txt", "size": 6833, "excerpt": "观察利润表可以知道，企业最终的利润主要来自三部分：经营利润、投资收益以及营业外收入。这三部分构成利润的三大支柱，分析利润的构成非常重要。具体来说，我们应分析企业经营活动带来的经营利润的质量怎么样，这是企业核心利润来源，因此，也称作核心利润。 经营利润＝营业收入－营业成本－期间费用"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "批一批资产负债表债务法！！！", "path": "马靖昊说会计_分类/财报分析方法/0239 批一批资产负债表债务法！！！.txt", "size": 7966, "excerpt": "我国执行《企业会计准则第18号－－所得税》的企业（目前主要是上市公司和部分大型国有企业），必须使用“资产负债表债务法”，以保证会计信息的质量。 采用资产负债表债务法时： 应交所得税=应纳税所得额×税率 应纳税所得额：税前会计利润±纳税调整增加(减少)额 所得税费用=当期应交所得税"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "不要以为报表的“金额”中有一个“金”字就真的有“金”", "path": "马靖昊说会计_分类/财报分析方法/0243 不要以为报表的“金额”中有一个“金”字就真的有“金”.txt", "size": 5683, "excerpt": "引言：最近看到不少公众号转发我过去写的这篇文章，因此，在这里再发一次，以供大家参考。看财报除了要重视每个项目金额的大小以外，更应重视每个项目金额质量的高低，不要以为报表的“金额”中有一个“金”字就真的有“金”。 比如金额再高的资产，若其质量不高，也就是实际含金量并不等于其金额，其"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "资产负债表日！！！", "path": "马靖昊说会计_分类/财报分析方法/0246 资产负债表日！！！.txt", "size": 9237, "excerpt": "（一） 在我国会计年度中，今天是会计人的重要日子：年度资产负债表日，它指的是年度结账和编制年报的日期。大家要注意，年度资产负债表日不是年报报出的日期，要是会计准则规定它也是年报报出的日期就好，大家就不用学“资产负债表日后事项”了，因为已经在31日报出了，就没有日后事项了，大家是不"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "合同资产与合同负债", "path": "马靖昊说会计_分类/财报分析方法/0274 合同资产与合同负债.txt", "size": 9621, "excerpt": "阿熊1991：请马老师讲讲合同资产、合同负债是什么东西，谢谢！ 马靖昊：好的，我来告诉你，它们是什么东西！ 合同资产是什么东西？ 合同资产是在新收入准则下对应收账款科目作出的进一步增补，根据《企业会计准则第14号——收入》，合同资产，是指企业已向客户转让商品而有权收取对价的权利，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "无形资产！", "path": "马靖昊说会计_分类/财报分析方法/0276 无形资产！.txt", "size": 8246, "excerpt": "根据《首次公开发行股票并上市管理办法》第26条第4款规定：“最近一期末无形资产（扣除土地使用权、水面养殖权和采矿权等后）占净资产的比例不高于 20％。” 有一家拟IPO的企业功课没做好，以为指的是报表中的无形资产数额占净资产的比例。其实，按照现行证监会的审核口径，上述条款中的无形"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "怎样一眼就知道财报中藏有猫腻呢？其实就这么简单......", "path": "马靖昊说会计_分类/财报分析方法/0277 怎样一眼就知道财报中藏有猫腻呢？其实就这么简单.......txt", "size": 8768, "excerpt": "上市公司的财报都是专业人士做出来的，对于大多数股民而言，财务造假是非常难识别的。那么，怎么可以一眼就知道财报中藏有猫腻呢？其实最简单的办法就是看审计报告意见，只要是审计不敢出具标准无保留意见的财报，多多少少都存在造假的问题，只不过造假的程度不同罢了。 按照中国证监会的规定，审计意"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "与会计有关的笑话！！！", "path": "马靖昊说会计_分类/财报分析方法/0286 与会计有关的笑话！！！.txt", "size": 8861, "excerpt": "几个财务总监在吹嘘各自的业务能力时，一个财务总监说：“我手下的一个会计有一次现金差五毛钱平不了账，一脸紧张地跑来请教我，我看了看，顺手就扔给他一张五毛钱的钞票，没想到，这笨蛋居然直接贴在现金账上，气得我还得告诉他放到保险柜中。” 黑眼圈不二耗子: 有这种总监、会计公司也是危险啊…"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "剥下会计的“画皮”－－兼论会计之道", "path": "马靖昊说会计_分类/财报分析方法/0290 剥下会计的“画皮”－－兼论会计之道.txt", "size": 25033, "excerpt": "主题：趣谈会计 嘉宾： 媒体平台会计明星 马靖昊 主持人： 财道家塾执行群主 孙健 对话嘉宾： 大地通讯集团 董事、副总经理兼财务总监 陈立云 SYKES赛科斯 中国财务总监 汤民鸣 深圳桑菲 财务部高级经理 张君晓 深圳电信工程 财务经理 冯绍星 鹰皇环境 CEO 杨炤寰 下面"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "只要是负债，就是缺钱，别跟我谈什么利用杠杆做大规模！", "path": "马靖昊说会计_分类/财报分析方法/0292 只要是负债，就是缺钱，别跟我谈什么利用杠杆做大规模！.txt", "size": 6981, "excerpt": "毛利润高的企业，只要规模产量能跟上，并且应收账款还很少，那么就是印钞机了。这时，再考察一下它的现金循环周期（净运营资本天数）以及有息负债率，如果比同行低不少，则此家企业就无敌了！ 注：一般而言，如果一个公司的毛利率在40%以上，那么该公司大都具有某种持续竞争优势；毛利率在40%以"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "炒股看不懂财报没关系，看审计意见就可以！（A股2021年度4803家财报审计意见汇总）", "path": "马靖昊说会计_分类/财报分析方法/0293 炒股看不懂财报没关系，看审计意见就可以！（A股2021年度4803家财报审计意见汇总）.txt", "size": 18093, "excerpt": "目前，A股上市公司年报披露法定日期已过，同花顺iFinD数据显示，截至5月5日上午，A股4803家上市公司除11家未在法定期限内披露年报外，其年报审计意见及数量分布为： 1、1家公司的财报被出具了否定意见。 2、248家公司的财务报告被出具了非标准审计意见。其中： （1）106家"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "什么是现金循环周期​？为什么它揭示了管理资产负债表的重要意义？", "path": "马靖昊说会计_分类/财报分析方法/0295 什么是现金循环周期​？为什么它揭示了管理资产负债表的重要意义？.txt", "size": 7881, "excerpt": "现金循环周期也可以称为净运营资本天数，它是指从支付原材料货款开始到最终收回本公司货款为止的时间过程。现金循环周期过程为：现金流出购买原材料，现金变为原材料及库存停留在企业内部，再变为销售的应收款以及最终回款又变回现金。 其实，现金循环周期与马克思讲的货币资本循环的概念是一致的，马"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "某些上市公司的资产负债表就是“垃圾场”！", "path": "马靖昊说会计_分类/财报分析方法/0296 某些上市公司的资产负债表就是“垃圾场”！.txt", "size": 8324, "excerpt": "好多年前我就指出了资产负债表有沦为“垃圾场”的趋势！下面是写于2013年7月25日的一条微博： 目前资产负债表有沦为“垃圾场”的趋势，（某些上市公司）为了迎合虚增利润的需要，必然要对资产进行调整。对资产类实账户进行调整是要害死人的，它会不断地结转下去，让报表中堆满什么也不是的所谓"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "惊呆股民！一顿操作获利65亿元，必须解读它的账务处理！", "path": "马靖昊说会计_分类/财报分析方法/0304 惊呆股民！一顿操作获利65亿元，必须解读它的账务处理！.txt", "size": 9897, "excerpt": "点击下方卡片关注我 ​陕西煤业25日晚间公告，隆基绿能于5月20日召开年度股东大会完成第五届董事会换届工作，公司在隆基绿能新一届董事会中未再委派董事。至此，公司对隆基绿能不再具有重大影响，根据有关规定，会计核算方法由长期股权投资变更为金融资产核算。 解读：企业如果将权益法核算的长"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "交增值税最多的企业家才是最牛的企业家！不是产值最大也不是利润最多！", "path": "马靖昊说会计_分类/财报分析方法/0305 交增值税最多的企业家才是最牛的企业家！不是产值最大也不是利润最多！.txt", "size": 6238, "excerpt": "点击下方卡片关注我 交增值税最多的企业家才是最牛的企业家，不是产值最大也不是利润最多。交增值税最多说明企业毛利（营业额增加值）最大，毛利这个指标才是企业增长的关键指标。至于销售费用、管理费用也大的话，那是为社会作贡献，财务费用也大的话，那是为银行作贡献。企业牛不牛，看毛利，看毛利"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "企业在聘请出纳时必须谨慎！否则......", "path": "马靖昊说会计_分类/财报分析方法/0316 企业在聘请出纳时必须谨慎！否则.......txt", "size": 6814, "excerpt": "点击下方卡片关注我 突然发现最有前途的岗位是出纳，某电商公司十年来在出纳岗位上诞生了一位老板娘，一位小三，一位行政总监，一位副总经理，不过有点小遗憾，就是没诞生出一位财务总监…这充分说明了能够当出纳的，都是不一般的人啊！但是情况在三年前发生了彻底逆转，这位老板娘亲自参与了出纳的招"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "有人一看见生产成本，就想当然地觉得应该进利润表，这种思维要不得啊", "path": "马靖昊说会计_分类/财报分析方法/0317 有人一看见生产成本，就想当然地觉得应该进利润表，这种思维要不得啊.txt", "size": 10348, "excerpt": "点击下方卡片关注我 有的人一看见生产成本，就想当然地觉得应该进利润表，这种思维要不得啊。生产成本虽然带有\"成本\"的字眼，但它是生产产品过程中需要付出的成本，它体现在资产负债表的存货中。产品成本只有通过销售活动才能转移到利润表中去，也就是说，只有当产品销售出去后，产品成本就结转为利"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "资产的异常增长！！！", "path": "马靖昊说会计_分类/财报分析方法/0319 资产的异常增长！！！.txt", "size": 7278, "excerpt": "点击下方卡片关注我 在发生过的上市公司财务造假案例中，但凡涉及巨额虚增利润的公司都无一例外地伴随着总资产的大幅增长。比如乐视网总资产从2010年起到总资产达到峰值时的2016年底，总资产年复合增长率为78％。虚增资产和利润的最终目的是圈进更多的钱。总资产的异常增长不是虚增利润的充"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "认缴制！！！", "path": "马靖昊说会计_分类/财报分析方法/0330 认缴制！！！.txt", "size": 8269, "excerpt": "点击下方卡片关注我 认缴制并不等于不缴！ 2014年公司注册资本由实缴制改为认缴制后，认缴制并不等于不缴，只是按照公司章程规定的期限来缴。下面是一个真实的故事，我有一个朋友在深圳注册了一家100亿元的公司，一分钱未真实入资，现在暂时不需要实际缴纳真金白银，但在50年内需要缴足。我"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "在内部审计论坛上的分享发言", "path": "马靖昊说会计_分类/财报分析方法/0338 在内部审计论坛上的分享发言.txt", "size": 6538, "excerpt": "点击下方卡片关注我 以下内容是我几年前在北京国家会计学院举办的“数字经济时代下的内部审计转型”中的《圆桌论坛》上的发言，今天读来，感觉对大伙还是有一定的启发，故发布在这里。 大家下午好，来到这个内部审计论坛，说实在话，内心有点忐忑，因为我必须向大家承认，我并不是这个领域的专家，甚"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "唉，谈恋爱最有效的方法", "path": "马靖昊说会计_分类/财报分析方法/0341 唉，谈恋爱最有效的方法.txt", "size": 7530, "excerpt": "点击下方卡片关注我 引言：这是本人写于几年前的东西，今天看到有公众号在转载，因此，发在此让大家感受下。 刚才有人问我，由于没钱，快要被女朋友抛弃了，问我有什么方法。我告诉他去重温一下权责发生制，他说，这算什么答案。看来他会计的悟性还真有点问题，他要懂权责发生制，就知道给她女朋友画"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "成功企业的报表是这样进阶的！", "path": "马靖昊说会计_分类/财报分析方法/0347 成功企业的报表是这样进阶的！.txt", "size": 5738, "excerpt": "点击下方卡片关注我 【成功企业的报表是这样进阶的】1.第1阶段：一般2至3年，不管创业时有多艰难，它最终一定融来了一大把银子，拥有一张牛逼的现金流量表；第2阶段，一般在第4年后，能融来钱，说明商业模式可行，它开始赚钱并拥有一张牛逼的利润表；第3阶段，有了牛逼的利润表，它最终必然拥"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "如何全面且合理地分析财务报表间的勾稽关系？", "path": "马靖昊说会计_分类/财报分析方法/0357 如何全面且合理地分析财务报表间的勾稽关系？.txt", "size": 8133, "excerpt": "点击下方卡片关注我 财务报表分析的核心原则：匹配所谓财务报表分析的勾稽关系，最核心的就是匹配原则。这里所讲的匹配，不只是财务报表数据之间要匹配，还要跳出财务报表的框架，从行业、产业链等多角度去验证财务数据的匹配情况。 （一）要与行业整体水平相匹配。一般情况下，标的公司的各项财务数"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "有息负债与无息负债！！！", "path": "马靖昊说会计_分类/财报分析方法/0359 有息负债与无息负债！！！.txt", "size": 7459, "excerpt": "点击下方卡片关注我 负债可以分为两类，无息负债和有息负债。无息负债一般是指来自经销商先付款后提货形成的预收账款，以及向供货商延期支付形成的应付票据和应付账款，说通俗点，无息负债就是通过欠产业链上下游的钱，做自己的生意。有息负债，包括银行长期借款、发行债券等，它的特点就是负债越多需"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "颜值本身绝对是一项资产！！！", "path": "马靖昊说会计_分类/财报分析方法/0368 颜值本身绝对是一项资产！！！.txt", "size": 4445, "excerpt": "点击下方卡片关注我 颜值本身绝对是一项资产，符合资产的定义，它是父母过去的爱的事项形成的、由你拥有、预期会给你带来经济利益的资源。有研究表明，女性高于平均颜值收入增加4%，低于平均颜值收入减少5%；而男性更残酷，高于平均颜值收入增加5%，低于平均颜值收入减少10%。如果一家企业的"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "固定资产！！！", "path": "马靖昊说会计_分类/财报分析方法/0372 固定资产！！！.txt", "size": 10716, "excerpt": "点击下方卡片关注我 有一位仁兄听会计说公司的汽车是固定资产，反问道，汽车可会跑动啊，怎么说是固定资产。请你也先不要笑，到底谁对谁错，还不知道呢？ 再给大家一个例子，刚才在外面看到一幢新盖的房子，我突然想到在财务上可以用多达四个科目记载它。如是自建自用的，完工后可记为“固定资产”，"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "利润反映经营成果“应该是什么”，那“实际是什么”呢？", "path": "马靖昊说会计_分类/财报分析方法/0378 利润反映经营成果“应该是什么”，那“实际是什么”呢？.txt", "size": 9375, "excerpt": "点击下方卡片关注我 在比较多的情况下，上市公司所发生的资产减值损失是以前年度的不能转化为现金流的利润所造成的。因此，在分析上市公司利润表时，脑壳里一定要问这样的一个问题，即它的利润额中大约有多少最终能转化为现金流，不能转化为现金流的利润所形成的“资产”是不是以后会通过资产减值来化"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "非经常性损益！！！", "path": "马靖昊说会计_分类/财报分析方法/0381 非经常性损益！！！.txt", "size": 9878, "excerpt": "点击下方卡片关注我 非经常性损益是指与公司主营业务无关的收支(包括资产出售、政府补贴或罚款等众多情形)，由于该项收入并不是公司经常性营业所得，不具备可持续性，具有偶然性和不可持续性等特点。非经常性损益不能真实反映企业的成长性，影响报表使用人对公司经营业绩和盈利能力做出正常判断。因"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "流动资产的一些事！！！", "path": "马靖昊说会计_分类/财报分析方法/0388 流动资产的一些事！！！.txt", "size": 7868, "excerpt": "点击下方卡片关注我 一般说来，企业应收账款周转率越高，说明企业催收账款的速度越快，可以减少坏账损失，而且资产流动性强，企业的短期偿债能力也会增强。若企业应收账款周转率过低，则说明企业催收账款的效率太低或信用政策十分宽松，会影响企业资金利用率和资金的正常周转，增加坏账发生的比率，最"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "合并报表！！！", "path": "马靖昊说会计_分类/财报分析方法/0397 合并报表！！！.txt", "size": 8871, "excerpt": "点击下方卡片关注我 谈然从容的乌镇：老马，请教个问题。连续编制合并报表时，为什么要将上期抵消的内部应收账款计提的坏账准备抵消？ 【用刘欢的《从头再来》解说连续编制合并报表】昨天所有的记录,已变成遥远的回忆(合并分录是暂时性的)，勤勤苦苦已编过合并，今夜重又走入风雨(每一年要重新编"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "批一批资产负债表债务法！！！", "path": "马靖昊说会计_分类/财报分析方法/0399 批一批资产负债表债务法！！！.txt", "size": 8080, "excerpt": "点击下方卡片关注我 我国执行《企业会计准则第18号－－所得税》的企业（目前主要是上市公司和部分大型国有企业），必须使用“资产负债表债务法”，以保证会计信息的质量。 采用资产负债表债务法时： 应交所得税=应纳税所得额×税率 应纳税所得额：税前会计利润±纳税调整增加(减少)额 所得税"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "江泽民同志论会计、审计", "path": "马靖昊说会计_分类/财报分析方法/0406 江泽民同志论会计、审计.txt", "size": 9149, "excerpt": "点击下方卡片关注我 会计篇 党政领导干部也应该学一点会计知识，学会简单地分析资产负债表。一个企业生产经营的过程，集中反映在一张资产负债表上。通过对企业资产负债表的分析，可以找出企业经营管理中存在的问题，从而可以更好地提出改善经营管理的措施。出自：《江泽民文选（第二卷）》出版日期："}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "懂会计，其实弄懂宏观经济有先天的优势", "path": "马靖昊说会计_分类/财报分析方法/0408 懂会计，其实弄懂宏观经济有先天的优势.txt", "size": 11199, "excerpt": "点击下方卡片关注我 资产负债表是经济运行中的一个核心问题，分析宏观经济运行是处于增长期还是衰退期，看资产负债表是扩表还是缩表就可以搞得清清楚楚、明明白白。目前家庭、企业、地方政府的资产负债表已经不断地在缩表，说明经济正在衰退。 先看家庭资产负债表，这些年家庭资产负债表都在萎缩，第"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "大家对企业赚取了多少利润大可不必当真", "path": "马靖昊说会计_分类/财报分析方法/0410 大家对企业赚取了多少利润大可不必当真.txt", "size": 5875, "excerpt": "点击下方卡片关注我 “逝者如斯夫，不舍昼夜”，会计上的“持续经营”的基本假设盖源于此，但企业对经济活动进行确认、计量时却不得不对时间进行截取。 时间是永恒流动的，正如“抽刀断水水更流”，要想分清哪个数字是前期、当期还是以后期间的，谈何容易？于是便有了权责发生制、配比、划分收益性与"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "未分配利润！！！", "path": "马靖昊说会计_分类/财报分析方法/0411 未分配利润！！！.txt", "size": 6433, "excerpt": "点击下方卡片关注我 从概念上讲，未分配利润是企业未作分配的利润，在以后年度可继续进行分配，在未进行分配之前，属于所有者权益的组成部分。从数量上来看，企业未分配利润是期初未分配利润加上本期实现的净利润，减去提取的各种盈余公积和分出的利润后的余额。企业当年实现的利润总额在交完所得税后"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "我也“阳”了！", "path": "马靖昊说会计_分类/财报分析方法/0413 我也“阳”了！.txt", "size": 5294, "excerpt": "点击下方卡片关注我 原来以为“阳”是别人家的事，唉，我真不是神仙啊，在北京第一波疫情中，就立刻中招了。 现给大伙说说我的亲身抗疫过程，希望对大家有所帮助。从12月8日开始至12月12日，为了不感染上新冠病毒，我每天用一种用百草制作的无有名字的中药做雾化，以期“御敌于国门之外”，事"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "史上首次！PCAOB 获得检查和调查中国在美国上市的公司审计业务的完全权限", "path": "马靖昊说会计_分类/财报分析方法/0416 史上首次！PCAOB 获得检查和调查中国在美国上市的公司审计业务的完全权限.txt", "size": 7888, "excerpt": "点击下方卡片关注我 “美国上市公司会计监督委员会（PCAOB ）宣布在2022年能够对总部设在中国和香港、在PCAOB注册的公共会计师事务所的发行人审计业务进行完整检查和调查。这标志着中国当局首次准许按符合美国标准进行完整检查和调查，这是《萨班斯-奥克斯利法案》的要求。\" 美国证"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "应该把提升老百姓的收入摆在优先位置", "path": "马靖昊说会计_分类/财报分析方法/0418 应该把提升老百姓的收入摆在优先位置.txt", "size": 5780, "excerpt": "点击下方卡片关注我 一到经济下行时，政府就强调要把扩大消费摆在优先位置。其实，本末倒置了，应该把提升老百姓的收入摆在优先位置。老百姓兜里没有多少钱，再刺激又有什么用呢？老百姓挣钱容易了，兜里有钱了，自然会自己安排消费，用得着刺激吗？谁不向往美好的生活。投机开花：天天喊你消费，就是"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "资产负债表日！！！", "path": "马靖昊说会计_分类/财报分析方法/0422 资产负债表日！！！.txt", "size": 10057, "excerpt": "点击下方卡片关注我 在我国会计年度中，今天是会计人的重要日子：年度资产负债表日，它指的是年度结账和编制年报的日期。大家要注意，年度资产负债表日不是年报报出的日期，要是会计准则规定它也是年报报出的日期就好，大家就不用学“资产负债表日后事项”了，因为已经在31日报出了，就没有日后事项"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "分析一下建设机械的财报及预测2023年度盈利情况，该股票是否在低位，付卫平被套2年多了，能否解套？?", "path": "马靖昊说会计_分类/财报分析方法/0423 分析一下建设机械的财报及预测2023年度盈利情况，该股票是否在低位，付卫平被套2年多了，能否解套？_.txt", "size": 9955, "excerpt": "点击下方卡片关注我 收入下降，业绩亏损，股价过山车式下滑，疫情影响和房地产行业波动或为主因。2022年三季度，该公司营业收入同比下降17.93%，归属净利润亏损4618万元，是2015年资产重组以来的第一次收入负增长，也是第一次亏损。持续低迷的业绩对该公司的股价造成了很大冲击，股"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "净利润！", "path": "马靖昊说会计_分类/财报分析方法/0426 净利润！.txt", "size": 9499, "excerpt": "点击下方卡片关注我 【净利润与扣非净利润的区别】净利润=利润总额-所得税。扣非净利润全称是扣除非经常损益后的净利润。非经常性损益的特点就在于名字里的“非”字，意思就是不经常发生的，不能持续获取的损益，比如：出售子公司股权、处置在建工程、无形资产和其他长期资产的损益；各种形式的政府"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "从财报看企业的竞争力！！！", "path": "马靖昊说会计_分类/财报分析方法/0431 从财报看企业的竞争力！！！.txt", "size": 7741, "excerpt": "点击下方卡片关注我 通过分析毛利率指标，可以了解一家公司的产品竞争力及风险。高毛利率说明公司的产品或服务有很强的竞争力，相应，低毛利率则说明公司的产品或服务竞争力较差。一般来说，毛利率大于 40%的公司都有某种核心竞争力。优秀公司的毛利率不但高还比较稳定，波动幅度比较小。一般来说"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "可持续的利润！！！", "path": "马靖昊说会计_分类/财报分析方法/0436 可持续的利润！！！.txt", "size": 8127, "excerpt": "点击下方卡片关注我 观察利润表可以知道，企业最终的利润主要来自三部分：经营利润、投资收益以及营业外收入。这三部分构成利润的三大支柱，分析利润的构成非常重要。具体来说，我们应分析企业经营活动带来的经营利润的质量怎么样，这是企业核心利润来源，因此，也称作核心利润。 经营利润＝营业收入"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "利润！！！", "path": "马靖昊说会计_分类/财报分析方法/0438 利润！！！.txt", "size": 8079, "excerpt": "点击下方卡片关注我 我讲到利润时，往往作这样的总结：“利润可以来自资产，也可以来自负债，甚至可以来自权益；可以来自销售，可以来自采购，也可以来自政府，甚至可以来自天堂；可透支未来，可穿越还……无处不在，一切利润皆为浮云，莫为浮云遮望眼。”近日受到启发，觉得这个“利润”的总结太啰嗦"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "会计的核心是资产", "path": "马靖昊说会计_分类/财报分析方法/0439 会计的核心是资产.txt", "size": 7784, "excerpt": "点击下方卡片关注我 【会计的核心是资产】资产是可以延伸到未来灭失的费用；费用是现时灭失的资产；收入是非外部投入原因而新增的资产；负债是未来需要付出的资产；所有者权益是资产减去未来需要付出的资产即负债后的净额，又称为净资产；在没有外部投入和对外分配的情况下，净资产的增值就是利润，减"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "合同资产与合同负债", "path": "马靖昊说会计_分类/财报分析方法/0440 合同资产与合同负债.txt", "size": 9765, "excerpt": "点击下方卡片关注我 阿熊1991：请马老师讲讲合同资产、合同负债是什么东西，谢谢！马靖昊：好的，我来告诉你，它们是什么东西！ 合同资产是什么东西？ 合同资产是在新收入准则下对应收账款科目作出的进一步增补，根据《企业会计准则第14号——收入》，合同资产，是指企业已向客户转让商品而有"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "说说会计利润和经济利润", "path": "马靖昊说会计_分类/财报分析方法/0442 说说会计利润和经济利润.txt", "size": 6125, "excerpt": "点击下方卡片关注我 我们会计师一般只关心显性的生产成本，也就是生产某种产品或提供某种服务所发生的费用，因此，利润＝总收入－总成本。 但是，在经济学家的眼中，这些支出没有反映出生产的总成本，对经济学家而言，这一结果高估了利润。原因在于经济利润的概念包括了生产的显性成本和隐性成本，即"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "聪明的姑娘找老公时，看重的是他的资产负债表，尤其是母公司的资产负债表", "path": "马靖昊说会计_分类/财报分析方法/0443 聪明的姑娘找老公时，看重的是他的资产负债表，尤其是母公司的资产负债表.txt", "size": 6160, "excerpt": "点击下方卡片关注我 有些朋友总问我，分析财报时，资产负债表重要还是利润表、现金流量表重要。其实这个问题在生活中早解决了。比如女孩子找对象时，首先看的是家境，是穷是富；其次才是问这个小伙子能不能挣钱，挣多少钱。从这里，很容易明白资产负债表在财报分析中才是最核心的，利润表、现金流量表"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "负债的分析", "path": "马靖昊说会计_分类/财报分析方法/0449 负债的分析.txt", "size": 6024, "excerpt": "微信公众号又双叒叕改版了 不是星标的订阅号 您收到的推送可能仅有标题和缩略图 或者动辄十天半个月 都无法收到最新推送 很容易错过为大家精心撰写的文章！！！ 为了可以及时看到 一定要按以下步骤操作 ↓↓↓ 第1步 进入公众号主页第2步 点击右上角\"...\"，“设为星标”（账号旁显示"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "未分配利润的分析", "path": "马靖昊说会计_分类/财报分析方法/0451 未分配利润的分析.txt", "size": 7777, "excerpt": "微信公众号又双叒叕改版了 不是星标的订阅号 您收到的推送可能仅有标题和缩略图 或者动辄十天半个月 都无法收到最新推送 很容易错过为大家精心撰写的文章！！！ 为了可以及时看到 一定要按以下步骤操作 ↓↓↓ 第1步 进入公众号主页第2步 点击右上角\"...\"，“设为星标”（账号旁显示"}, {"lib": "majinghao", "libname": "马靖昊说会计", "cat": "财报分析方法", "title": "资产减值！！！", "path": "马靖昊说会计_分类/财报分析方法/0464 资产减值！！！.txt", "size": 7 tle": "【090】既要募资又不泄露策略，可能实现吗？", "path": "因子投资_话题文章/基金/018 【090】既要募资又不泄露策略，可能实现吗？.txt", "size": 11574, "excerpt": "资产管理人，尤其初创期的私募基金管理人，面临的一大难题是如何有效向潜在客户证明自身有优异的管理能力从而顺利募资。为充分论证这一点，基金管理人往往需要给出策略逻辑、不同时段的历史表现，乃至较为详细的交易策略。但传递这些信息会让基金管理人面临一个巨大的潜在风险，即投资者可能自行复制其"}, {"lib": "yinzi", "libname": "因子投资", "cat": "基金", "title": "【091】园长自己关于中国基金市场的研究", "path": "因子投资_话题文章/基金/019 【091】园长自己关于中国基金市场的研究.txt", "size": 11797, "excerpt": "从 2017 年开始研究 FoF 开始，已有 5 年多的时间。自 2019 年开始严谨的学术研究以来，也有近 3 年时间。虽然相关学术研究更多以美国市场为基础进行，但对中国市场仍然一直有持续的关注和研究，毕竟中国基金市场已是全球第四大市场，也是我们未来进行投资研究最重要的领域。在"}, {"lib": "yinzi", "libname": "因子投资", "cat": "基金", "title": "Update|基金研究：常识与趋势", "path": "因子投资_话题文章/基金/020 Update_基金研究：常识与趋势.txt", "size": 2400, "excerpt": "2020 年底，我们根据当时的一场报告，发布过一份名为《基金研究：常识与趋势》的 slides（参见基金研究：常识与趋势）. 时隔约 20 个月，我们对 slides 做了一定更新。（强烈建议配合基金研究：文献综述 (I)阅读，详见川总写量化。）这份 slides 的初衷是对关于"}, {"lib": "yinzi", "libname": "因子投资", "cat": "基金", "title": "【092】学术打脸系列（I）|基金规模报酬递减之争", "path": "因子投资_话题文章/基金/021 【092】学术打脸系列（I）_基金规模报酬递减之争.txt", "size": 10777, "excerpt": "学术研究中的常见现象之一便是后续研究打脸已有研究。正面的争议也是促进学术研究进步的重要途径。例如，BetaPlus 小组早年梳理的金融学顶刊中关于资产定价研究的建设性“怼人”就是一些很好的案例。实际上，随着建模工具和数据的日益丰富，早期研究中深入人心的“共识”越来越多地被推翻。但"}, {"lib": "yinzi", "libname": "因子投资", "cat": "基金", "title": "【093】机器学习与基金研究（I）：业绩预测", "path": "因子投资_话题文章/基金/022 【093】机器学习与基金研究（I）：业绩预测.txt", "size": 9343, "excerpt": "老早就想做一个关于利用机器学习方法进行基金研究的梳理总结。由于我们自己也在做一些相关的工作，所以迟迟没有动笔。最近川总和王熙老师翻译的芝加哥大学金融学教授 Stefan Nagel 的书《机器学习与资产定价》（参见川总的推文）正式上架，又在一个会议上听到了一篇非常有趣的相关研究，"}, {"lib": "yinzi", "libname": "因子投资", "cat": "基金", "title": "【099】抄基金作业可以随随便便成功吗？", "path": "因子投资_话题文章/基金/023 【099】抄基金作业可以随随便便成功吗？.txt", "size": 21520, "excerpt": "由于基金需要定期批露持仓，抄基金作业——主要是抄那些业绩优异的基金的作业——成为了备受关注的策略。诸多券商对此有非常深入的分析，从简单的跟踪基金持仓股票到模仿基金投资风格（例如海通金工的报告“海量”专题（195）——从优秀基金经理的投资风格到因子组合。虽然抄作业看起来可以获得还不"}, {"lib": "yinzi", "libname": "因子投资", "cat": "基金", "title": "【100】园长研究|基金投资者真的不“学习”吗？", "path": "因子投资_话题文章/基金/024 【100】园长研究_基金投资者真的不“学习”吗？.txt", "size": 39029, "excerpt": "新年快乐！这是因子动物园的第 100 期原创研究推文，也是 2023 年 const LS = D.links, ARTS = D.arts, PDFS = D.pdfs;
const LIBM = {}; LS.forEach(l=>LIBM[l.key]=l);

let curLib = 'all', curCat = 'all', kw = '';

// 初始化
document.getElementById('stat').textContent =
  `${ARTS.length} 篇 · ${LS.length} 个库 · ${PDFS.length} 份PDF`;

function esc(s){return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hl(s){
  s = esc(s);
  if(!kw) return s;
  kw.split(/\s+/).filter(Boolean).forEach(k=>{
    try{ s = s.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }catch(e){}
  });
  return s;
}

// 库筛选
const lf = document.getElementById('libf');
lf.innerHTML = `<div class="chip on" data-k="all">全部库<span class="n">${ARTS.length}</span></div>` +
  LS.map(l=>{
    const n = ARTS.filter(a=>a.lib===l.key).length;
    return `<div class="chip" data-k="${l.key}" style="border-left:3px solid ${l.color}">${l.icon} ${esc(l.name)}<span class="n">${n}</span></div>`;
  }).join('');
lf.onclick = e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  [...lf.children].forEach(x=>x.classList.remove('on')); c.classList.add('on');
  curLib = c.dataset.k; curCat='all'; renderCats(); render();
};

// 分类筛选
function renderCats(){
  const cf = document.getElementById('catf');
  let pool = curLib==='all'? ARTS : ARTS.filter(a=>a.lib===curLib);
  const cnt = {}; pool.forEach(a=>{const k=a.lib+'::'+a.cat; cnt[k]=(cnt[k]||0)+1});
  const ks = Object.keys(cnt).sort();
  cf.innerHTML = `<div class="chip on" data-k="all">全部分类<span class="n">${pool.length}</span></div>` +
    ks.map(k=>{
      const [lk,cat]=k.split('::');
      return `<div class="chip" data-k="${esc(k)}">${esc(cat)}<span class="n">${cnt[k]}</span></div>`;
    }).join('');
  cf.onclick = e=>{
    const c = e.target.closest('.chip'); if(!c) return;
    [...cf.children].forEach(x=>x.classList.remove('on')); c.classList.add('on');
    curCat = c.dataset.k; render();
  };
}

// 检索
function match(a){
  if(kw){
    const terms = kw.toLowerCase().split(/\s+/).filter(Boolean);
    const hay = (a.title+' '+a.excerpt+' '+a.cat).toLowerCase();
    if(!terms.every(t=>hay.includes(t))) return false;
  }
  if(curCat!=='all'){
    if(a.lib+'::'+a.cat !== curCat) return false;
  } else if(curLib!=='all' && a.lib!==curLib) return false;
  return true;
}

function render(){
  const res = ARTS.filter(match);
  document.getElementById('count').textContent = `匹配 ${res.length} 篇`;
  const list = document.getElementById('list');
  const emp = document.getElementById('empty');

  // PDF 区（仅无筛选时展示）
  const pw = document.getElementById('pdfwrap');
  if(kw==='' && curLib==='all' && curCat==='all' && PDFS.length){
    pw.innerHTML = `<div class="pdfsec"><h2>📕 PDF 原文（${PDFS.length} 份）</h2><div class="pdflist">` +
      PDFS.map(p=>`<a class="pdfitem" href="${esc(encodeURI(p.path))}" target="_blank">
        <span>📄</span><span>${esc(p.name)}</span><span class="sz">${(p.size/1024/1024).toFixed(1)}MB</span></a>`).join('') +
      `</div></div>`;
  } else pw.innerHTML='';

  if(!res.length){ list.innerHTML=''; emp.style.display='block'; return; }
  emp.style.display='none';

  // 分组
  const groups = {};
  res.forEach(a=>{ const k=a.lib+'::'+a.cat; (groups[k]=groups[k]||[]).push(a); });
  const order = Object.keys(groups).sort();

  list.innerHTML = order.map(k=>{
    const [lk]=k.split('::');
    const L = LIBM[lk]||{name:lk,color:'#888',icon:''};
    const cat = groups[k][0].cat;
    return `<div class="grp">
      <div class="grph">
        <span class="dot" style="background:${L.color}"></span>
        <h2>${esc(cat)}</h2>
        <span class="lib">${L.icon} ${esc(L.name)}</span>
        <span class="cnt">${groups[k].length} 篇</span>
      </div>
      ${groups[k].map(a=>`<div class="card">
        <div class="t">${hl(a.title)}</div>
        <div class="ex">${hl(a.excerpt)}</div>
        <div class="meta">
          <span class="tag">${esc(a.libname)}</span>
          <span class="tag">${(a.size/1024).toFixed(0)}KB</span>
          <a class="open" href="${esc(encodeURI(a.path))}" target="_blank">打开 →</a>
        </div>
      </div>`).join('')}
    </div>`;
  }).join('');
}

// 搜索（防抖）
let timer;
document.getElementById('q').oninput = e=>{
  clearTimeout(timer);
  timer = setTimeout(()=>{ kw = e.target.value.trim(); render(); }, 180);
};
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement.id!=='q'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key==='Escape'){ const q=document.getElementById('q'); q.value=''; kw=''; render(); q.blur(); }
});
addEventListener('scroll', ()=>{ document.getElementById('top').style.display = scrollY>400?'block':'none'; });

renderCats(); render();
</script>
